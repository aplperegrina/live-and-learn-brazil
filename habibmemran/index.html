/* Boletim de bairro: jornal de dados, ardósia azulada, goiaba e amarelo fechado; fontes e cartões do dashboard */
:root{
  --bg:#FBFCF8; --ink:#232B3A; --ink2:#3A4458; --muted:#56607A; --rule:#D5DAE3; --soft:#F6F9FF; --soft2:#E6EBF3;
  --blue:#34425E; --blue2:#4F6488; --blue3:#8E9DBB; --red:#E0604E; --red2:#F9DDD6;
  --yel:#C99A1F; --yeltx:#8C6A00; --champ:#DCC792; --slate:#3E495F; --onslate:#C3CAD6;
  --q1:#E2E7F0; --q2:#BAC4D7; --q3:#8796B3; --q4:#566A8E; --q5:#2E3B55; --q0:#EEF0F4; --h1:#F3E7D3; --h2:#E2C89C; --h3:#BF9454;
  --display:'Libertinus Sans', 'Segoe UI', Arial, sans-serif;
  --ui:'Open Sans', 'Segoe UI', Arial, sans-serif;
  --narrow:'PT Sans Narrow', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;font-weight:500;line-height:1.6;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue2)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.k{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.btn{font:700 15px/1 var(--ui);padding:14px 20px;border:0;background:var(--blue);color:#fff;cursor:pointer;min-height:46px;border-radius:0}
.btn.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.red{background:var(--red)}
.seg{display:inline-flex;border:2px solid var(--blue);flex-wrap:wrap}
.seg button{font:700 14px/1 var(--ui);padding:10px 14px;border:0;background:#fff;color:var(--blue);cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* barra superior */
.top{background:var(--slate);color:#fff;position:relative;overflow:hidden;border-bottom:2px solid var(--champ)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px;font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.1em}
.top::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:180px;background:var(--red);transform:skewX(-24deg)}
.top .wrap>*{position:relative;z-index:1}
.lang{display:inline-flex;border:1.5px solid var(--champ);background:rgba(255,255,255,.06)}
.lang button{background:transparent;color:#fff;border:0;font:700 15px/1 var(--narrow);padding:8px 14px;cursor:pointer;min-height:38px;letter-spacing:.12em}
.lang button[aria-pressed="true"]{background:var(--champ);color:var(--slate)}

/* cabeçalho */
.mast{border-bottom:3px solid var(--ink);padding-block:22px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:end}
.mast .bar{width:12px;align-self:stretch;background:var(--red)}
.mast .name{font-family:var(--display);font-weight:800;font-size:clamp(38px,6.4vw,74px);line-height:.95}
.mast .name span{color:var(--slate)}
.mast .meta{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--ink2);text-align:right;display:grid;gap:3px}
@media (max-width:640px){.mast{grid-template-columns:auto minmax(0,1fr)}.mast .meta{grid-column:1/-1;text-align:left}}

/* abertura + adivinhe */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:34px;padding-block:38px 42px;align-items:start;position:relative;background:var(--slate);box-shadow:0 0 0 100vmax var(--slate);clip-path:inset(0 -100vmax);color:#FAF9F4;border-top:2px solid var(--champ);border-image:linear-gradient(var(--champ) 0 0) 1 / 2px 0 0 0 / 0 100vmax}
.hero .small{color:var(--onslate)} .hero a{color:var(--champ)}
.hero h1{font-size:clamp(34px,4.8vw,56px);line-height:1.08;color:#FAF9F4}
.hero .lead{font-size:20px;color:var(--onslate);margin-top:14px;max-width:34em}
.guess{position:relative;background:var(--soft);color:var(--ink);padding:26px 24px 24px;border-top:6px solid var(--champ);display:grid;gap:14px}
.guess::before{content:"";position:absolute;right:0;top:-6px;width:34%;height:6px;background:var(--red)}
.guess h2{font-size:26px;line-height:1.15}
.guess .val{font-family:var(--display);font-weight:800;font-size:clamp(33px,4.2vw,49px);color:var(--blue);line-height:1}
.thermo{--tw:30px;--p:.3;position:relative;height:54px;margin:30px 0 0;padding-left:38px}
.thermo input[type=range]{position:absolute;left:34px;right:0;top:0;bottom:0;width:calc(100% - 34px);height:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:grab;touch-action:none}
.thermo input[type=range]:active{cursor:grabbing}
.thermo input[type=range]::-webkit-slider-runnable-track{height:54px;background:transparent}
.thermo input[type=range]::-moz-range-track{height:54px;background:transparent}

.cm-rows{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px 40px;border-top:1px solid var(--champ);padding-top:18px}
.cm-g h3{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.cm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;margin-bottom:9px;font-size:15px}
.cm-row span{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-row b{font-family:var(--display);font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums}
.cm-row i{grid-column:1/-1;display:block;height:8px;background:var(--soft2);border-radius:4px;overflow:hidden}
.cm-row i em{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cm-row.sm i em{background:var(--blue3)}

@media (max-width:900px){.compra{grid-template-columns:minmax(0,1fr);padding:24px 18px 20px}.compra-res{grid-template-columns:minmax(0,1fr)}.cm-plan svg{width:min(190px,60vw)}}
@media (prefers-reduced-motion: reduce){.cm-in.hint{animation:none}.cm-row i em{transition:none}}

/* animação de entrada */
.rise{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rise.on{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;transform:none;transition:none}.track .mk,.track .fill,.res .bar i{transition:none}}
.rcl{fill:none;stroke:var(--blue2);stroke-width:1.4;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.75}

/* ===== v2: capa de jornal, grupos, barra de seções e vitrine ===== */
:root{--gbar:52px}
html{scroll-padding-top:calc(var(--gbar) + 8px)}
::selection{background:var(--champ);color:var(--ink)}
.top::after{display:none}
/* capa */
.capa{padding-block:20px 0}
.capa-mast{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 24px;align-items:end;padding-bottom:14px}
.capa-ed{font-family:var(--narrow);font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--ink2);line-height:1.35}
.capa-ed.r{text-align:right}
.capa-tit{text-align:center}
.capa-tit .k{color:var(--ink2);font-size:14px;letter-spacing:.2em}
.capa-tit .name{font-family:var(--display);font-weight:800;font-size:clamp(48px,8.4vw,104px);line-height:.92;color:var(--ink);margin-top:6px}
.capa-rule{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);height:4px}
@media (max-width:700px){
  .capa-mast{grid-template-columns:minmax(0,1fr)}
  .capa-ed,.capa-ed.r{text-align:center;font-size:14px}
  .capa-ed:first-child{order:2}.capa-ed.r{order:3}
}
/* faixa dos quatro grupos */
.secoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--ink)}
.secoes a{display:grid;gap:3px;padding:12px 16px 13px;text-decoration:none;color:var(--ink);min-height:64px;align-content:center}
.secoes a + a{border-left:1px solid var(--rule)}
.secoes b{font-family:var(--narrow);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.secoes span{font-size:14.5px;color:var(--ink2);line-height:1.35}
.secoes a:hover b{color:var(--red)}
@media (max-width:760px){
  .secoes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .secoes a:nth-child(3){border-left:0}
  .secoes a:nth-child(n+3){border-top:1px solid var(--rule)}
  .secoes a{padding:11px 12px}
}
/* três colunas */
.capa-cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1fr);border-bottom:3px solid var(--ink);margin-bottom:6px}
.capa-cols > *{padding:22px 22px 24px;min-width:0}
.capa-cols > * + *{border-left:1px solid var(--rule)}
.capa-cols > :first-child{padding-left:0}.capa-cols > :last-child{padding-right:0}
.cc-rot{font-family:var(--narrow);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px;display:block}
.cc-main h2{font-size:clamp(28px,3.4vw,42px);line-height:1.08}
.cc-main h2 a,.cc-mid h3 a,.cc-vit h3 a{color:inherit;text-decoration:none}
.cc-main h2 a:hover,.cc-mid h3 a:hover,.cc-vit h3 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--champ)}
.cc-main p{color:var(--ink2);margin-top:10px;max-width:38em}
.cc-graf{margin-top:16px;max-width:520px}
.cc-graf svg{display:block;width:100%;height:auto;overflow:visible}
.cc-graf text{font-family:var(--narrow);font-size:13px;fill:var(--ink2)}
.cc-link{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;font-weight:700;color:var(--blue);text-decoration:none;border-bottom:2px solid var(--champ)}
.cc-link:hover{color:var(--red)}
.cc-mid{display:grid;align-content:start}
.cc-mid article{padding-block:2px 16px}
.cc-mid article + article{border-top:1px solid var(--rule);padding-top:14px}
.cc-mid h3{font-size:21px;line-height:1.2}
.cc-mid p{font-size:15px;color:var(--ink2);margin-top:5px}
.cc-vit figure{margin:0 0 12px;aspect-ratio:4/3;background:var(--soft2);overflow:hidden}
.cc-vit figure img{width:100%;height:100%;object-fit:cover;display:block}
.cc-vit h3{font-size:21px;line-height:1.2}
.cc-vit p{font-size:15px;color:var(--ink2);margin-top:5px}
@media (max-width:1000px){
  .capa-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cc-main{grid-column:1/-1;padding-right:0!important;border-bottom:1px solid var(--rule)}
  .cc-mid{border-left:0!important;padding-left:0!important}
}
@media (max-width:640px){
  .capa-cols{grid-template-columns:minmax(0,1fr)}
  .capa-cols > *{padding:18px 0!important;border-left:0!important}
  .cc-vit{order:2;border-bottom:1px solid var(--rule)}.cc-mid{order:3}
}
/* barra fixa dos grupos (aparece depois da capa) */
.gbar{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--ink);transform:translateY(-110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
.gbar.on{transform:none}
.gbar .wrap{display:flex;align-items:center;gap:4px;height:var(--gbar);overflow-x:auto;scrollbar-width:none}
.gbar .wrap::-webkit-scrollbar{display:none}
.gbar .nome{font-family:var(--display);font-weight:800;font-size:22px;margin-right:14px;white-space:nowrap;color:var(--ink);text-decoration:none}
.gbar a.g{font-family:var(--narrow);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-decoration:none;white-space:nowrap;padding:0 12px;min-height:44px;display:inline-flex;align-items:center;border-bottom:3px solid transparent}
.gbar a.g[aria-current="true"]{color:var(--blue);border-bottom-color:var(--red)}
@media (max-width:640px){.gbar .nome{display:none}.gbar a.g{padding:0 10px;font-size:14px}}
@media (prefers-reduced-motion: reduce){.gbar{transition:none}}
/* aberturas dos grupos */
.grupo{padding-block:10px 6px;margin-top:44px}
.grupo .wrap{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 28px;align-items:end;border-top:3px solid var(--ink);padding-top:16px}
.grupo h2{font-size:clamp(40px,6vw,72px);line-height:.95;color:var(--ink)}
.grupo p{color:var(--ink2);max-width:40em;padding-bottom:6px}
@media (max-width:760px){.grupo .wrap{grid-template-columns:minmax(0,1fr)}.grupo{padding-block:8px 0;margin-top:32px}}
#topo,#ritmo{margin-top:22px}
/* ritmo do mercado (taxas) */
.ritmo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));border-top:4px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.ritmo div{padding:16px 16px 16px 0;display:grid;gap:3px}
@media (min-width:700px){.ritmo div + div{padding-left:16px;border-left:1.5px solid var(--rule)}}
.ritmo b{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.2vw,38px);color:var(--blue);line-height:1.05}
.ritmo span{font-size:14.5px;color:var(--ink2);line-height:1.4}
.ritmo .up{color:var(--yeltx)}.ritmo .down{color:var(--blue)}
/* vitrine */
.vt-faixa + .vt-faixa{margin-top:38px}
.vt-faixa h3{font-family:var(--display);font-size:26px;line-height:1.15;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:16px}
.vt-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.vt-card{background:#fff;border-top:3px solid var(--champ);display:grid;grid-template-rows:auto 1fr;min-width:0;box-shadow:0 1px 2px rgba(35,43,58,.06),0 8px 22px -14px rgba(35,43,58,.22)}
.vt-card figure{margin:0;aspect-ratio:4/3;overflow:hidden;background:var(--soft2)}
.vt-card figure img{width:100%;height:100%;object-fit:cover;display:block}
.vt-body{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.vt-cod{font-family:var(--narrow);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vt-card h4{font-family:var(--display);font-size:22px;line-height:1.2;margin:0}
.vt-fatos{font-size:15px;color:var(--ink2);line-height:1.45}
.vt-preco{font-family:var(--display);font-weight:800;font-size:27px;color:var(--blue);line-height:1.1}
.vt-preco small{display:block;font-family:var(--ui);font-weight:500;font-size:13.5px;color:var(--muted);margin-top:3px}
.vt-car{font-size:14px;color:var(--ink2);line-height:1.45;border-top:1px solid var(--rule);padding-top:8px}
.vt-btn{justify-self:start;margin-top:4px;text-decoration:none;display:inline-flex;align-items:center}
.vt-vazio{color:var(--ink2);background:var(--soft);padding:18px 20px}
.vt-nota{margin-top:26px}
@media (max-width:860px){
  .vt-row{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:min(82%,330px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;margin-right:calc(-1 * max(18px, env(safe-area-inset-right, 0px)))}
  .vt-card{scroll-snap-align:start}
}

/* ===== v2: termômetro de vidro ===== */
.thermo.v2{--pl:58px;--pr:22px;height:112px;margin:22px 0 4px;padding:0;user-select:none}
.thermo.v2 .th-placa{position:absolute;left:30px;right:0;top:0;height:100%;background:linear-gradient(180deg,#fff,#FAFBFD);border:1px solid var(--champ);border-radius:6px;box-shadow:0 1px 2px rgba(35,43,58,.06)}
.thermo.v2 .th-grad{position:absolute;left:var(--pl);right:var(--pr);top:12px;height:38px}
.thermo.v2 .th-grad i{position:absolute;bottom:0;width:1px;height:6px;background:rgba(35,43,58,.45);transform:translateX(-.5px)}
.thermo.v2 .th-grad i.M{height:12px;width:1.5px;background:var(--ink)}
.thermo.v2 .th-grad b{position:absolute;bottom:15px;transform:translateX(-50%);font:700 13px/1 var(--narrow);color:var(--ink2);letter-spacing:.02em}
.thermo.v2 .th-un{position:absolute;right:8px;bottom:6px;font:700 11.5px/1 var(--narrow);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.thermo.v2 .th-vidro{position:absolute;left:30px;right:calc(var(--pr) - 12px);top:56px;height:28px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(226,231,240,.75) 55%,rgba(255,255,255,.95) 100%);box-shadow:inset 0 0 0 1.5px rgba(52,66,94,.5),inset 0 -4px 6px rgba(52,66,94,.10),0 1px 0 #fff}
.thermo.v2 .th-vidro::after{content:"";position:absolute;left:30px;right:14px;top:5px;height:3px;border-radius:2px;background:rgba(255,255,255,.95);box-shadow:0 0 2px rgba(255,255,255,.9)}
.thermo.v2 .th-cap{position:absolute;left:calc(var(--pl) - 30px);right:12px;top:10px;height:8px;border-radius:4px;background:rgba(52,66,94,.06);box-shadow:inset 0 1px 2px rgba(52,66,94,.18)}
.thermo.v2 .th-merc{position:absolute;left:-34px;top:0;bottom:0;width:calc(34px + var(--p) * (100% - 0px));border-radius:0 4px 4px 0;background:linear-gradient(180deg,#F39A88 0%,#E0604E 45%,#B4432F 100%)}
.thermo.v2 .th-merc::after{content:"";position:absolute;right:1px;top:1px;width:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.75)}
.thermo.v2 .th-bulbo{position:absolute;left:4px;top:45px;width:52px;height:52px;border-radius:50%;z-index:1;background:radial-gradient(circle at 34% 30%,#FFE3DC 0 6%,#F39A88 14%,#E0604E 48%,#A93B28 100%);box-shadow:inset 0 0 0 1.5px rgba(52,66,94,.5),inset -4px -6px 10px rgba(80,20,10,.25),0 6px 12px -6px rgba(169,59,40,.6)}
.thermo.v2 .th-bulbo::before{content:"";position:absolute;left:10px;top:8px;width:15px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-28deg)}
.thermo.v2 .th-ponta{position:absolute;top:89px;left:calc(var(--pl) + var(--p) * (100% - var(--pl) - var(--pr)));width:0;height:0;margin-left:-7px;border:7px solid transparent;border-bottom:9px solid var(--blue);border-top:0;pointer-events:none}
.thermo.v2 input[type=range]{position:absolute;left:var(--pl);right:var(--pr);top:40px;height:66px;width:auto;opacity:0;z-index:3;cursor:ew-resize;margin:0}
.thermo.v2 input[type=range]::-webkit-slider-runnable-track{height:66px}
.thermo.v2 input[type=range]::-moz-range-track{height:66px}
.thermo.v2 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:66px;margin-top:0;border:0;box-shadow:none}
.thermo.v2 input[type=range]::-moz-range-thumb{width:2px;height:66px;border:0;box-shadow:none}
.thermo.v2:focus-within .th-vidro{outline:3px solid var(--red);outline-offset:3px}
.thermo.v2 .realmk{top:2px;bottom:16px;width:2px;margin-left:-1px;left:calc(var(--pl) + var(--rp,0) * (100% - var(--pl) - var(--pr)));background:var(--blue);z-index:2}
.thermo.v2 .realmk span{bottom:auto;top:-24px;margin:0;background:var(--blue);color:#fff;box-shadow:none;padding:3px 8px;font:700 13px/1.1 var(--narrow);letter-spacing:.04em}
@media (prefers-reduced-motion: reduce){.thermo.v2 .realmk{transition:none}}
.guess .val{color:var(--red)}
.guess .val.vazio{letter-spacing:.02em}

.mapa-cta .tel{grid-row:1 / span 2;grid-column:2;font-family:var(--display);font-weight:800;color:var(--blue);font-size:24px;white-space:nowrap;text-decoration:none}
@media (max-width:640px){.mapa-cta{grid-template-columns:minmax(0,1fr)}.mapa-cta .tel{grid-row:auto;grid-column:auto;font-size:21px}}
/* no celular: busca, mapa (com a chamada) e, embaixo, o cartão da quadra */
@media (max-width:900px){.atlas{grid-template-columns:minmax(0,1fr);gap:14px}.panel{display:contents}.panel .finder{order:-2}.panel .msg{order:-1}.panel .pcard{order:1}.mapcol{display:contents}.mapa-cta{order:2}}
/* taxas do bairro: um painel, cada tópico em sanfona */
#painel .sec-h h2{font-size:clamp(22px,2.4vw,28px)}
.sanfonas{display:grid;gap:10px}
.sanfona{padding:0;gap:0;background:var(--papel)}
.sanfona > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:14px 18px;min-height:56px}
.sanfona > summary::-webkit-details-marker{display:none}
.sanfona > summary h3{font-size:20px}
.sanfona > summary::after,.hist > summary .sf-seta{content:"";width:12px;height:12px;border-right:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(45deg) translate(-3px,-3px);transition:transform .25s}
.sanfona[open] > summary::after,.hist[open] > summary .sf-seta{transform:rotate(225deg) translate(-3px,-3px)}
.sanfona > summary:hover h3,.hist > summary:hover h2{color:var(--redtx)}
.sanfona > summary:focus-visible,.hist > summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sf-corpo{padding:2px 18px 18px;display:grid;gap:8px;border-top:1px solid var(--rule)}
.sf-corpo > svg{max-width:860px}
.sf-corpo .two{margin-top:6px}
@media (prefers-reduced-motion: reduce){.sanfona > summary::after,.hist > summary .sf-seta{transition:none}}
/* dicas do bairro */
.forte .phrase{font-size:clamp(20px,2.2vw,27px);line-height:1.25}
.tips{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tip{background:var(--papel);padding:14px;gap:6px}
.tip .n{font-size:26px}
.tip h3{font-size:17.5px;line-height:1.2}
.tip p{font-size:14.5px;line-height:1.5}
@media (max-width:1000px){
  .tips{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:min(78%,280px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-right:calc(-1 * max(18px, env(safe-area-inset-right, 0px)))}
  .tip{scroll-snap-align:start}
}
.gcat:nth-child(even){background:var(--soft)}
/* um pouco de história, em sanfona com o relógio de bolso */
.hist{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
.hist > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:14px 4px}
.hist > summary::-webkit-details-marker{display:none}
.hist > summary h2{font-size:clamp(26px,3vw,36px)}
.hist .relogio{display:block;filter:drop-shadow(0 2px 2px rgba(35,43,58,.18))}
.hist-corpo{padding:8px 0 22px}

<script id="C" type="application/json">{"prep":"em","edicao":{"pt":"Edição de novembro de 2026","en":"November 2026 edition"},"dados_ate":{"pt":"Vendas registradas até agosto de 2026","en":"Sales recorded through August 2026"},"area_desc":{"pt":"Higienópolis, Vila Buarque, Santa Cecília e Pacaembu, entre a Av. Pacaembu, a linha do trem, a R. Conselheiro Nébias, a R. da Consolação, a R. Piauí e a Av. Dr. Arnaldo.","en":"Higienópolis, Vila Buarque, Santa Cecília and Pacaembu, between Av. Pacaembu, the railway, R. Conselheiro Nébias, R. da Consolação, R. Piauí and Av. Dr. Arnaldo."},"subareas":{"todos":{"pt":"Região toda","en":"Whole area"},"pacaembu":{"pt":"Pacaembu","en":"Pacaembu"},"higienopolis":{"pt":"Higienópolis","en":"Higienópolis"},"mackenzie":{"pt":"Higienópolis–Mackenzie e Vila Buarque","en":"Higienópolis–Mackenzie and Vila Buarque"},"santacecilia":{"pt":"Santa Cecília","en":"Santa Cecília"},"santacecilia_norte":{"pt":"Santa Cecília norte","en":"Santa Cecília north"}},"sub_obs":{"pacaembu":{"pt":"Área tombada do bairro: casas em terrenos grandes e poucas vendas de apartamento. Para casas, veja o relatório e o mapa (quadras em laranja).","en":"Listed garden district: houses on large lots and few apartment sales. For houses, see the report and the map (blocks in orange)."},"higienopolis":{"pt":"A oeste da Av. Angélica, em volta da Praça Buenos Aires e da Av. Higienópolis: apartamentos grandes e prédios clássicos.","en":"West of Av. Angélica, around Praça Buenos Aires and Av. Higienópolis: large apartments and classic buildings."},"mackenzie":{"pt":"Entre a Av. Angélica e a R. da Consolação, até a R. Piauí, com o Mackenzie e a Vila Buarque: mais studios e apartamentos compactos.","en":"Between Av. Angélica and R. da Consolação, down to R. Piauí, with Mackenzie and Vila Buarque: more studios and compact units."},"santacecilia":{"pt":"Entre o Minhocão e Higienópolis, em volta do Largo Santa Cecília.","en":"Between the Minhocão and Higienópolis, around Largo Santa Cecília."},"santacecilia_norte":{"pt":"Ao norte do Minhocão, até a linha do trem, sem os Campos Elíseos.","en":"North of the Minhocão up to the railway, excluding Campos Elíseos."}},"forte":{"titulo":{"pt":"O forte da região","en":"What the area does best"},"frase":{"pt":"Prédios clássicos de Higienópolis, casas tombadas do Pacaembu e a vida de bairro de Santa Cecília, perto do metrô.","en":"Classic buildings in Higienópolis, listed houses in Pacaembu and neighborhood life in Santa Cecília, close to the metro."},"itens":[{"pt":"Higienópolis, a oeste da Av. Angélica, tem o maior m² da região: R$ 14.854 por m² de área privativa estimada, com apartamento típico de 117 m² (ITBI).","en":"Higienópolis, west of Av. Angélica, has the highest price per m² in the area: R$ 14,854 per m² of estimated private area, with a typical apartment of 117 m² (ITBI)."},{"pt":"Duas estações da Linha 6-Laranja, FAAP-Pacaembu e Higienópolis-Mackenzie, estão em obra, com previsão de abertura em outubro de 2027. Hoje a região já tem a Linha 4-Amarela e a Linha 3-Vermelha.","en":"Two Line 6-Orange stations, FAAP-Pacaembu and Higienópolis-Mackenzie, are under construction, expected to open in October 2027. The area is already served by Line 4-Yellow and Line 3-Red."},{"pt":"Em 2025 foram 1.856 vendas de apartamentos, mais que em 2021 (1.740), com o m² subindo todos os anos desde então (ITBI).","en":"In 2025 there were 1,856 apartment sales, more than in 2021 (1,740), with the price per m² rising every year since (ITBI)."}]},"dicas":{"titulo":{"pt":"Dicas para quem vai vender ou comprar","en":"Tips for sellers and buyers"},"itens":[{"t":{"pt":"Compare com a sua microrregião","en":"Compare with your sub-area"},"d":{"pt":"O m² vai de R$ 8.445 em Santa Cecília norte a R$ 14.854 em Higienópolis. A média da região toda esconde essa diferença: use o seletor do painel e o mapa da sua quadra.","en":"The price per m² ranges from R$ 8,445 in Santa Cecília north to R$ 14,854 in Higienópolis. The overall average hides this gap: use the dashboard selector and your block on the map."}},{"t":{"pt":"Área do IPTU e área privativa","en":"Tax-record area and private area"},"d":{"pt":"A Prefeitura registra a área do IPTU, que inclui áreas comuns e vagas; os anúncios usam a área privativa. Na hora de comparar preços, confira sempre qual das duas está sendo usada. Neste boletim, os números principais estimam a área privativa e o valor pelo IPTU aparece ao lado.","en":"The City records the tax-record (IPTU) area, which includes common areas and parking; listings use private area. When comparing prices, always check which one is used. In this bulletin, the main figures estimate private area and the IPTU-based value is shown alongside."}},{"t":{"pt":"Pacaembu: regras do tombamento","en":"Pacaembu: heritage rules"},"d":{"pt":"O bairro é tombado pelo Condephaat e pelo Conpresp. Reforma, ampliação ou demolição de casa depende de aprovação desses órgãos. Antes de comprar para reformar, peça a consulta prévia; antes de vender, reúna as aprovações já feitas.","en":"The district is listed by the state and city heritage boards (Condephaat and Conpresp). Renovating, extending or demolishing a house needs their approval. Before buying to renovate, request a preliminary review; before selling, gather the approvals already granted."}},{"t":{"pt":"Studios: liquidez com concorrência","en":"Studios: liquidity with competition"},"d":{"pt":"Entre 2021–22 e 2025–26, o m² dos flats e studios subiu 31,4% e as vendas por mês subiram 25,0% (ITBI). Há muitos lançamentos compactos em Santa Cecília e na Vila Buarque: quem vende um usado concorre com unidades novas.","en":"Between 2021–22 and 2025–26, the price per m² of serviced flats and studios rose 31.4% and monthly sales rose 25.0% (ITBI). Many compact launches are under way in Santa Cecília and Vila Buarque: sellers of older units compete with new ones."}},{"t":{"pt":"IPTU 2026","en":"2026 property tax"},"d":{"pt":"A nova planta de valores (Lei 18.330/2025) limita o aumento do IPTU a 10% ao ano. O imóvel residencial único com valor venal de até R$ 260 mil é isento, e há desconto até R$ 390 mil. Confira o valor venal na guia antes de negociar.","en":"The new valuation map (Law 18,330/2025) caps the annual property-tax increase at 10%. A single residential property with an assessed value of up to R$ 260,000 is exempt, with a discount up to R$ 390,000. Check the assessed value on the bill before negotiating."}}]},"relatorio":{"titulo":{"pt":"Relatório residencial e comercial","en":"Residential and commercial report"},"intro":{"pt":"Comparação entre 2021–2022 e 2025–2026, com as guias de ITBI pagas na Prefeitura. A variação de volume usa a média de vendas por mês.","en":"Comparison between 2021–2022 and 2025–2026, using the property-transfer tax (ITBI) records from the City. Volume change uses average sales per month."},"comercial_titulo":{"pt":"Lojas e salas comerciais","en":"Shops and offices"},"comercial":[{"pt":"As vendas de salas comerciais caíram 24,7% por mês entre 2021–22 e 2025–26, com o m² subindo 6,9%. As lojas foram na direção contrária: o volume subiu 33,3% e o m² 20,0% (ITBI).","en":"Office sales fell 24.7% a month between 2021–22 and 2025–26, while the price per m² rose 6.9%. Shops went the other way: volume rose 33.3% and the price per m² 20.0% (ITBI)."},{"pt":"O Shopping Pátio Higienópolis tinha 1,8% de lojas vagas em junho de 2026, com novas aberturas e nenhuma expansão anunciada (relatório do fundo SHPH11, Rio Bravo).","en":"Shopping Pátio Higienópolis had 1.8% vacancy in June 2026, with new openings and no expansion announced (SHPH11 fund report, Rio Bravo)."}],"notas":{"apto":{"pt":"O m² subiu 14,5% e o volume de vendas subiu 22,2%.","en":"Price per m² rose 14.5% and sales volume rose 22.2%."},"casa":{"pt":"O m² subiu 21,3% e o volume de vendas caiu 6,2%.","en":"Price per m² rose 21.3% and sales volume fell 6.2%."},"escritorio":{"pt":"O m² subiu 6,9% e o volume de vendas caiu 24,7%.","en":"Price per m² rose 6.9% and sales volume fell 24.7%."},"loja":{"pt":"O m² subiu 20,0% e o volume de vendas subiu 33,3%.","en":"Price per m² rose 20.0% and sales volume rose 33.3%."},"flat":{"pt":"O m² subiu 31,4% e o volume de vendas subiu 25,0%.","en":"Price per m² rose 31.4% and sales volume rose 25.0%."}}},"artigo":{"titulo":{"pt":"Onde estão as oportunidades","en":"Where the opportunities are"},"paragrafos":[{"pt":"Nos 12 meses até agosto de 2026, a região registrou 1.923 vendas de apartamentos, cerca de 160 por mês, 9,5% a mais que no período anterior (ITBI, Prefeitura de São Paulo). O m² privativo estimado chegou a R$ 10.718, alta de 7,1% em um ano (R$ 6.439 pela área do IPTU), e o apartamento típico foi vendido por R$ 640.000, com cerca de 62 m² privativos.","en":"In the 12 months to August 2026, the area recorded 1,923 apartment sales, about 160 a month, 9.5% more than in the previous period (ITBI, City of São Paulo). The estimated private-area price per m² reached R$ 10,718, up 7.1% in a year (R$ 6,439 by IPTU area), and the typical apartment sold for R$ 640,000, with about 62 m² of private area."},{"pt":"Em Higienópolis o m² ficou estável em um ano, em R$ 14.854, enquanto Higienópolis–Mackenzie e Vila Buarque subiu 10,0% e Santa Cecília norte 7,2%. As duas estações da Linha 6 previstas para 2027 tendem a pesar mais nas quadras perto da Rua da Consolação e da FAAP, e o destino do Minhocão, que pela lei deve ser desativado até 2029, segue em estudo na Prefeitura.","en":"In Higienópolis the price per m² held steady over the year at R$ 14,854, while Higienópolis–Mackenzie and Vila Buarque rose 10.0% and Santa Cecília north 7.2%. The two Line 6 stations due in 2027 are likely to matter most for blocks near Rua da Consolação and FAAP, and the future of the Minhocão, which by law must be decommissioned by 2029, is still under study by the City."},{"pt":"No Pacaembu o mercado é de casas: nos últimos 12 meses foram vendidas 45, com valor mediano de R$ 3,6 milhões e terreno mediano de 458 m² (ITBI). Entre 2021–22 e 2025–26, o m² das casas da região subiu 21,3%, com menos vendas por mês; a oferta é pequena e o tombamento limita novas construções.","en":"Pacaembu is a market of houses: 45 were sold in the last 12 months, with a median price of R$ 3.6 million and a median lot of 458 m² (ITBI). Between 2021–22 and 2025–26, the price per m² of houses in the area rose 21.3%, with fewer sales a month; supply is small and the heritage listing limits new construction."}]},"noticias":{"titulo":{"pt":"Pesquisa e notícias","en":"Research and news"},"nota":{"pt":"Cada notícia traz o link das fontes.","en":"Each story links to its sources."},"itens":[{"data":"2026-07","t":{"pt":"Linha 6-Laranja abre a primeira etapa; estações da região ficam para 2027","en":"Line 6-Orange opens its first stage; the area's stations are due in 2027"},"d":{"pt":"A linha começou a operar em 3 de julho com seis estações, de João Paulo I a Perdizes. FAAP-Pacaembu e Higienópolis-Mackenzie estão previstas para outubro de 2027; em abril, a obra da Higienópolis-Mackenzie, uma das mais profundas da América Latina, estava em 65%.","en":"The line opened on July 3 with six stations, from João Paulo I to Perdizes. FAAP-Pacaembu and Higienópolis-Mackenzie are due in October 2027; in April, work on Higienópolis-Mackenzie, one of the deepest stations in Latin America, was 65% complete."},"f":[["Agência Brasil","https://agenciabrasil.ebc.com.br/geral/noticia/2026-07/linha-6-laranja-do-metro-de-sp-inicia-operacao-nesta-sexta-feira"],["Estadão, via DGABC","https://www.dgabc.com.br/Noticia/4316614/linha-6-laranja-do-metro-como-estao-as-obras-de-cada-estacao-a-6-meses-da-entrega-da-1-etapa"]]},{"data":"2026-07","t":{"pt":"Requalifica Centro chega a 31 prédios aprovados para retrofit","en":"Requalifica Centro reaches 31 buildings approved for retrofit"},"d":{"pt":"Até maio, a Prefeitura aprovou 31 empreendimentos, com 2.690 moradias, pelo programa de incentivos ao retrofit no centro, que inclui parte de Santa Cecília. A subvenção econômica soma R$ 1 bilhão para custear parte das reformas.","en":"By May, the City had approved 31 projects with 2,690 homes under its downtown retrofit incentive program, which covers part of Santa Cecília. The economic subsidy totals R$ 1 billion to fund part of the renovations."},"f":[["SMUL, via Viva o Centro","https://vivaocentro.org.br/wp-content/uploads/2026/07/Projetos-para-o-centro-de-sao-pauloi.pdf"],["Prefeitura de São Paulo","https://prefeitura.sp.gov.br/w/noticia/prefeitura-de-sao-paulo-sanciona-lei-que-propoe-incentivos-fiscais-para-retrofit-de-predios-antigos-da-regiao-central"]]},{"data":"2026-02","t":{"pt":"Higienópolis ganha prédio voltado à longevidade","en":"Higienópolis gets a building designed for longevity"},"d":{"pt":"A Tecnisa e a Naara lançaram em Higienópolis um edifício com serviços de saúde e atendimento de emergência 24 horas, com unidades de 94 a 145 m². É um dos novos projetos de alto padrão do bairro, ao lado do Casa Piauí, da Helbor, na Rua Piauí.","en":"Tecnisa and Naara launched a building in Higienópolis with health services and 24-hour emergency care, with units of 94 to 145 m². It is one of the neighborhood's new high-end projects, alongside Helbor's Casa Piauí on Rua Piauí."},"f":[["Estadão, via Tecnisa","https://www.tecnisa.com.br/noticias/edifcio-da-tecnisa-e-naara-em-higienpolis-ter-foco-em-longevidade-e-atendimento-de-emergncia-24h"],["Helbor","https://helbor.com.br/empreendimentos/casa-piaui-higienopolis"]]},{"data":"2025-11","t":{"pt":"Nova planta de valores do IPTU limita aumento a 10% ao ano","en":"New property-tax valuation map caps increases at 10% a year"},"d":{"pt":"A lei aprovada pela Câmara atualiza os valores venais a partir de 2026, com teto de 10% de aumento anual. A isenção do imóvel residencial único passou a valer até R$ 260 mil.","en":"The law passed by the City Council updates assessed values from 2026, with a 10% annual cap on increases. The exemption for a single residential property now applies up to R$ 260,000."},"f":[["Prefeitura (Lei 18.330/2025)","https://legislacao.prefeitura.sp.gov.br/lei-18330-de-11-de-novembro-de-2025"],["Câmara Municipal","https://www.saopaulo.sp.leg.br/blog/plenario-aprova-em-definitivo-projeto-de-revisao-da-planta-generica-de-valores-da-capital-paulista/"]]},{"data":"2025-04","t":{"pt":"Prefeitura estuda desativar o Minhocão junto com novo boulevard","en":"City studies closing the Minhocão alongside a new boulevard"},"d":{"pt":"O Plano Diretor determina a desativação do elevado para carros até 2029. A Prefeitura estuda fazer isso junto com a extensão da Av. Marquês de São Vicente, que absorveria o tráfego; a escolha entre parque e demolição ainda não foi anunciada.","en":"The Master Plan requires the overpass to be closed to cars by 2029. The City is studying doing so alongside an extension of Av. Marquês de São Vicente to absorb traffic; a choice between a park and demolition has not been announced."},"f":[["Rádio Bandeirantes","https://www.band.com.br/radio-bandeirantes/noticias/prefeitura-de-sp-estuda-plano-para-ligar-zonas-oeste-e-leste-e-desativar-o-minhocao-entenda-202504030821"],["Jovem Pan","https://jovempan.com.br/noticias/ricardo-nunes-avalia-desativar-o-minhocao/"]]}]},"historia":{"titulo":{"pt":"Um pouco de história","en":"A bit of history"},"fontes":[["Higienópolis (Wikipédia)","https://pt.wikipedia.org/wiki/Higien%C3%B3polis_(S%C3%A3o_Paulo)"],["Pacaembu (Wikipédia)","https://pt.wikipedia.org/wiki/Pacaembu_(bairro_de_S%C3%A3o_Paulo)"],["Condephaat, Res. SC 8/1991","https://www.prefeitura.sp.gov.br/cidade/secretarias/upload/governo/desestatizacao/pacaembu/dr/Resolucao%20CONDEPHAAT%20n%C2%BA%2008-91.pdf"]],"itens":[{"ano":"anos 1890","pt":"Higienópolis é loteado como bairro de chácaras e palacetes, em terreno alto e arejado, longe das várzeas.","en":"Higienópolis is laid out as a district of mansions on high, airy ground, away from the flood plains."},{"ano":"anos 1920","pt":"A Companhia City urbaniza o vale do Pacaembu com ruas curvas que seguem o relevo, no modelo de bairro-jardim.","en":"Companhia City develops the Pacaembu valley with curving streets that follow the terrain, on the garden-suburb model."},{"ano":"1940","pt":"É inaugurado o Estádio do Pacaembu, na Praça Charles Miller.","en":"The Pacaembu Stadium opens on Praça Charles Miller."},{"ano":"1971","pt":"O Elevado João Goulart, o Minhocão, passa sobre a Av. São João e a Rua Amaral Gurgel e divide Santa Cecília.","en":"The João Goulart overpass, the Minhocão, is built over Av. São João and Rua Amaral Gurgel, cutting through Santa Cecília."},{"ano":"1991","pt":"O Condephaat tomba o Pacaembu, protegendo o traçado das ruas, a arborização e o padrão dos lotes.","en":"The state heritage board lists Pacaembu, protecting its street layout, trees and lot pattern."},{"ano":"hoje","pt":"O estádio reabriu em 2025 como Arena Pacaembu, e duas estações da Linha 6-Laranja estão em obra na região.","en":"The stadium reopened in 2025 as Arena Pacaembu, and two Line 6-Orange stations are under construction in the area."}]},"pois":{"st_repblica":{"pt":"Metrô República","en":"República station","k":"st"},"st_santaceclia":{"pt":"Metrô Santa Cecília","en":"Santa Cecília station","k":"st"},"st_marechaldeodor":{"pt":"Metrô Marechal Deodoro","en":"Marechal Deodoro station","k":"st"},"st_palmeirasbarra":{"pt":"Metrô Palmeiras-Barra Funda","en":"Palmeiras-Barra Funda station","k":"st"},"st_clnicas":{"pt":"Metrô Clínicas","en":"Clínicas station","k":"st"},"st_consolao":{"pt":"Metrô Consolação","en":"Consolação station","k":"st"},"st_paulista":{"pt":"Metrô Paulista","en":"Paulista station","k":"st"},"st_higienpolismac":{"pt":"Metrô Higienópolis-Mackenzie","en":"Higienópolis-Mackenzie station","k":"st"},"mackenzie":{"pt":"Mackenzie","en":"Mackenzie University","k":"shop"},"faap":{"pt":"FAAP","en":"FAAP","k":"shop"},"patio":{"pt":"Pátio Higienópolis","en":"Pátio Higienópolis mall","k":"shop"},"arena":{"pt":     meta.textContent = `${nf(p.n)} ${L==='en'?'listings':'anúncios'} · ${p.area} m² · ${money(p.valor)}`;
    const rc = el('rect',{x:0,y:narrow?y0+14*F+12:y0+24,width:w,height:16,fill:i%2?'#3F6B36':'#1E3A24'},s);
    if (anim && !reduce){ rc.style.transform='scaleX(0)'; rc.style.transformOrigin='0 0'; rc.style.transition=`transform .9s cubic-bezier(.2,.8,.2,1) ${0.1*i}s`; requestAnimationFrame(()=>requestAnimationFrame(()=>rc.style.transform='scaleX(1)')); }
    const v = el('text',{x:w+8,y:narrow?y0+14*F+12+14:y0+37,'font-size':14*F,'font-weight':800,fill:'#1E3A24'},s); v.textContent = R(p.m2);
  });
  set('c4-h', L==='en'?'Most expensive neighborhoods':'Bairros mais caros');
  set('c4-s', L==='en'?'Median asking price per m², apartments':'m² mediano pedido, apartamentos');
  set('c4-f', L==='en'?'Median usable area and median asking price shown beside each name.':'Ao lado de cada nome, a área útil mediana e o preço pedido mediano.');
}

function selectM(k){
  const o = byKey[k]; if (!o) return; if (cur) cur.el.classList.remove('sel'); cur = o; o.el.classList.add('sel'); o.el.parentNode.appendChild(o.el);
  const f = o.f; set('p-k', L==='en'?'This area':'Esta área');

  set('p-nl', L==='en'?'listings':'anúncios'); set('p-vl', L==='en'?'median asking price':'preço pedido mediano'); set('p-gl', L==='en'?'houses listed':'casas anunciadas');
  const big = $('p-big');
  if (f.a){ big.innerHTML = `${R(f.a[0])}<small>/m²*</small><span class="iptu">${L==='en'?'asking price, apartments, usable area':'preço pedido, apartamentos, área útil'}</span>`; set('p-n', nf(f.a[1])); set('p-v', money(f.a[2])); set('p-g', f.h ? nf(f.h[1]) : '0'); set('p-note', f.a[1] < 3 ? (L==='en'?'Small sample: fewer than 3 listings.':'Amostra pequena: menos de 3 anúncios.') : (f.h ? (L==='en'?`Houses here: ${R(f.h[0])}/m² asked in ${f.h[1]} listings.`:`Casas aqui: ${R(f.h[0])}/m² pedidos em ${f.h[1]} anúncios.`) : '')); }
  else if (f.h){ big.innerHTML = `${R(f.h[0])}<small>/m² · ${L==='en'?'houses':'casas'}</small>`; set('p-n', nf(f.h[1])); set('p-v', money(f.h[2])); set('p-g', nf(f.h[1])); set('p-note', L==='en'?'For houses, the price includes the land and is divided by built area only.':'Em casas, o preço inclui o terreno e é dividido só pela área construída.'); }

function textM(){

function footM(){
  $('foot').innerHTML = L==='en'
   ? `<div>Sources: active sale listings on QuintoAndar collected on ${dcol()} (${nf(D.kpi.n)} listings in the 20 neighborhoods, ${nf(D.kpi.n_apto)} apartments and ${nf(D.kpi.n_casa)} houses); FipeZap index monthly reports (Fipe/Zap); news and reports linked in each section.</div><div class="nota-m2"><b>* About asking prices.</b> Osasco does not publish its property-transfer tax (ITBI) records, so this bulletin uses the prices asked in listings, divided by the usable area stated in each listing. Closing prices are usually somewhat lower than asking prices. These are statistical medians for the neighborhood and the area. They do not represent the actual value of any specific property, which varies with the construction standard, its condition and the data confirmed in the property registry (matrícula). For a valuation of your property, talk to Habib.</div><div>Houses: price divided by built area; the price includes the land. Areas with fewer than 3 listings are flagged.</div>`

}
