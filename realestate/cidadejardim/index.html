<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quanto vale o m² em Cidade Jardim? Painel, mapa interativo, notícias conferidas e guia de lugares especiais, por Andrea Longobardi (RE/MAX Verti).">
<meta property="og:title" content="Boletim Imobiliário · Cidade Jardim">
<meta property="og:description" content="Quanto vale o m² em Cidade Jardim? Painel, mapa interativo, notícias conferidas e guia de lugares especiais, por Andrea Longobardi (RE/MAX Verti).">
<meta property="og:locale" content="pt_BR">
<meta property="og:type" content="website">
<meta property="og:url" content="https://realestate.liveandlearnbrazil.com/cidadejardim/">
<link rel="canonical" href="https://realestate.liveandlearnbrazil.com/cidadejardim/">
<title>Boletim Imobiliário · Cidade Jardim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<style>
/* Boletim de bairro: jornal de dados em branco, alto contraste, blocos em azul RE/MAX e vermelho */
:root{
  --bg:#FFFFFF; --ink:#0A1428; --ink2:#273246; --muted:#4A5466; --rule:#CDD3DD; --soft:#F1F4F9; --soft2:#E4EAF3;
  --blue:#00296B; --blue2:#0047AB; --blue3:#5B82C4; --red:#DC1C2E; --red2:#F6D6DA;
  --q1:#DCE5F3; --q2:#AFC3E3; --q3:#7395CB; --q4:#2E5DA8; --q5:#00296B; --q0:#ECEFF4; --h1:#F3E7D3; --h2:#E2C89C; --h3:#BF9454;
  --display:'Playfair Display', Georgia, 'Times New Roman', serif;
  --ui:'Libre Franklin', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue2)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.k{font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.btn{font:700 15px/1 var(--ui);padding:14px 20px;border:0;background:var(--blue);color:#fff;cursor:pointer;min-height:46px;border-radius:0}
.btn.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.red{background:var(--red)}
.seg{display:inline-flex;border:2px solid var(--blue);flex-wrap:wrap}
.seg button{font:700 14px/1 var(--ui);padding:10px 14px;border:0;background:#fff;color:var(--blue);cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* barra superior */
.top{background:var(--blue);color:#fff;position:relative;overflow:hidden}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px;font-size:13px;font-weight:600;letter-spacing:.06em}
.top::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:180px;background:var(--red);transform:skewX(-24deg)}
.top .wrap>*{position:relative;z-index:1}
.lang{display:inline-flex;border:1.5px solid #fff}
.lang button{background:transparent;color:#fff;border:0;font:700 12.5px/1 var(--ui);padding:7px 10px;cursor:pointer;min-height:34px;letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:#fff;color:var(--blue)}

/* cabeçalho */
.mast{border-bottom:3px solid var(--ink);padding-block:22px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:end}
.mast .bar{width:12px;align-self:stretch;background:var(--red)}
.mast .name{font-family:var(--display);font-weight:800;font-size:clamp(38px,6.4vw,74px);line-height:.95}
.mast .name span{color:var(--blue)}
.mast .meta{font-size:13px;font-weight:600;color:var(--ink2);text-align:right;display:grid;gap:3px}
@media (max-width:640px){.mast{grid-template-columns:auto minmax(0,1fr)}.mast .meta{grid-column:1/-1;text-align:left}}

/* abertura + adivinhe */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:34px;padding-block:34px 40px;align-items:start}
.hero h1{font-size:clamp(32px,4.6vw,54px);line-height:1.05}
.hero .lead{font-size:19px;color:var(--ink2);margin-top:14px;max-width:34em}
.guess{position:relative;background:var(--soft);padding:26px 24px 24px;border-top:6px solid var(--blue);display:grid;gap:14px}
.guess::before{content:"";position:absolute;right:0;top:-6px;width:34%;height:6px;background:var(--red)}
.guess h2{font-size:26px;line-height:1.15}
.guess .val{font-family:var(--display);font-weight:800;font-size:clamp(33px,4.2vw,49px);color:var(--blue);line-height:1}
.thermo{--tw:30px;--p:.3;position:relative;height:54px;margin:30px 0 0;padding-left:38px}
.thermo .bulb{position:absolute;left:0;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6b78,var(--red) 60%,#a50f1e);box-shadow:0 0 0 5px #fff,0 0 0 7px var(--ink)}
.thermo .tube{position:absolute;left:34px;right:0;top:50%;height:22px;margin-top:-11px;background:#fff;border-radius:0 11px 11px 0;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden}
.thermo .merc{position:absolute;left:0;top:4px;bottom:4px;width:calc(var(--tw)/2 + var(--p)*(100% - var(--tw)) + 4px);background:linear-gradient(90deg,var(--red),#e8545f 40%,var(--red));border-radius:0 9px 9px 0;transition:width .12s}
.thermo .ticks{position:absolute;inset:0 calc(var(--tw)/2);background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1.5px),rgba(10,20,40,.35) calc(10% - 1.5px) 10%);mix-blend-mode:multiply;pointer-events:none;margin:0 -1px}
.thermo input[type=range]{position:absolute;left:34px;right:0;top:0;bottom:0;width:calc(100% - 34px);height:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:grab;touch-action:none}
.thermo input[type=range]:active{cursor:grabbing}
.thermo input[type=range]::-webkit-slider-runnable-track{height:54px;background:transparent}
.thermo input[type=range]::-moz-range-track{height:54px;background:transparent}
.thermo input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:var(--tw);height:44px;margin-top:5px;border-radius:10px;background:#fff;border:3px solid var(--blue);box-shadow:0 3px 8px rgba(0,41,107,.35),inset 0 0 0 4px #fff,inset 0 0 0 6px var(--blue2)}
.thermo input[type=range]::-moz-range-thumb{width:var(--tw);height:44px;border-radius:10px;background:#fff;border:3px solid var(--blue);box-shadow:0 3px 8px rgba(0,41,107,.35),inset 0 0 0 4px #fff,inset 0 0 0 6px var(--blue2)}
.thermo input[type=range]{opacity:0;z-index:3}
.thermo .knob{position:absolute;top:5px;width:var(--tw);height:44px;margin-left:calc(var(--tw)/-2);left:calc(34px + var(--tw)/2 + var(--p)*(100% - 34px - var(--tw)));border-radius:10px;background:#fff;border:3px solid var(--blue);box-shadow:0 3px 10px rgba(0,41,107,.4);display:flex;gap:3px;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.thermo .knob i{width:3px;height:18px;background:var(--blue2);border-radius:2px}
.thermo:focus-within .knob{outline:3px solid var(--red);outline-offset:2px}
.thermo input[type=range]:focus-visible{outline:none}
.thermo input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--red);outline-offset:2px}
.thermo .realmk{position:absolute;top:-6px;bottom:-6px;width:5px;margin-left:-2.5px;background:var(--blue);left:calc(34px + var(--tw)/2 + var(--rp,0)*(100% - 34px - var(--tw)));transition:left 1s cubic-bezier(.2,.8,.2,1);z-index:2;pointer-events:none}
.thermo .realmk span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;white-space:nowrap;font-size:12.5px;font-weight:800;color:var(--blue);background:#fff;padding:1px 6px;box-shadow:0 0 0 1.5px var(--blue)}
.guess .scale{padding-left:calc(34px + var(--tw,30px)/2 - 14px)}
.guess .scale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.reveal{display:grid;gap:10px}
.track{position:relative;height:46px;background:#fff;border:1.5px solid var(--rule)}
.track .mk{position:absolute;top:-4px;bottom:-4px;width:4px;transform:translateX(-2px);transition:left 1s cubic-bezier(.2,.8,.2,1)}
.track .mk span{position:absolute;top:100%;margin-top:6px;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;font-weight:700}
.track .mk.you{background:var(--red)} .track .mk.you span{color:var(--red)}
.track .mk.real{background:var(--blue);width:6px} .track .mk.real span{color:var(--blue);top:auto;bottom:100%;margin:0 0 6px}
.track .fill{position:absolute;top:0;bottom:0;background:var(--red2);transition:all 1s cubic-bezier(.2,.8,.2,1)}
.verdict{font-size:17px;font-weight:600}
.small{font-size:13.5px;color:var(--muted)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}

/* seções */
.sec{padding-block:46px;position:relative}
.sec-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;align-items:center;margin-bottom:24px}
.sec-h .sq{width:30px;height:30px;background:var(--blue);position:relative}
.sec-h .sq::after{content:"";position:absolute;left:0;top:30px;width:30px;height:8px;background:var(--red)}
.sec-h h2{font-size:clamp(28px,3.6vw,40px);line-height:1.08}
.sec-h p{grid-column:2;color:var(--ink2);max-width:46em}
.band{background:var(--soft)}
.band-blue{background:var(--blue);color:#fff}
.band-blue .k{color:#fff;opacity:.85}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:0;border-top:4px solid var(--ink);border-bottom:1.5px solid var(--ink);margin-bottom:22px}
.kpis div{padding:16px 16px 16px 0;display:grid;gap:2px}
@media (min-width:700px){.kpis div+div{padding-left:16px;border-left:1.5px solid var(--rule)}}
.kpis b{font-family:var(--display);font-weight:800;font-size:clamp(26px,3vw,36px);color:var(--blue);line-height:1.05}
.kpis span{font-size:13.5px;color:var(--ink2);font-weight:500;line-height:1.35}
.kpis .up{color:#0A7A3E;font-weight:700} .kpis .down{color:var(--red);font-weight:700}
.dash-tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:860px){.grid4{grid-template-columns:minmax(0,1fr)}}
.card{background:#fff;border:1.5px solid var(--rule);padding:18px 18px 14px;display:grid;gap:8px;position:relative;min-width:0}
.card::before{content:"";position:absolute;left:-1.5px;top:-1.5px;width:56px;height:6px;background:var(--blue)}
.card:nth-child(even)::before{background:var(--red)}
.card h3{font-family:var(--ui);font-size:17px;font-weight:800;letter-spacing:.01em}
.card .sub{font-size:13px;color:var(--muted)}
.card svg{width:100%;height:auto;display:block;overflow:visible}
.card svg text{font-family:var(--ui);fill:var(--ink2)}
.card .foot{font-size:12.5px;color:var(--muted)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.leg i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:5px}

/* mapa */
.atlas{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:start}
.mapbox{position:relative;border:2px solid var(--ink);background:var(--soft);width:100%;max-width:100%;overflow:hidden;touch-action:none}
.mapbox #map{width:100%;height:100%;display:block;cursor:grab}
.q{stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .2s}
.q.out{opacity:.45}
.q.c0{fill:var(--q0)} .q.c1{fill:var(--q1)} .q.c2{fill:var(--q2)} .q.c3{fill:var(--q3)} .q.c4{fill:var(--q4)} .q.c5{fill:var(--q5)}
.q.h1{fill:var(--h1)} .q.h2{fill:var(--h2)} .q.h3{fill:var(--h3)}
.q:hover{opacity:.8} .q.sel{stroke:var(--red);stroke-width:3.5}
.bound{fill:none;stroke:var(--red);stroke-width:2.6;stroke-dasharray:8 5;vector-effect:non-scaling-stroke;pointer-events:none}
.bound-h{fill:none;stroke:#fff;stroke-width:7;opacity:.85;vector-effect:non-scaling-stroke;pointer-events:none}
.poi text{font-family:var(--ui);font-size:12.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.zoombar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:44px;height:44px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:700 20px/1 var(--ui);cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;background:#fff;border:1.5px solid var(--ink);padding:9px 11px;font-size:12px;font-weight:600;display:grid;gap:5px;max-width:calc(100% - 20px)}
.legend .sw{display:flex}.legend .sw span{flex:1;height:11px;min-width:28px}
.legend .lb{display:flex;justify-content:space-between;gap:6px;color:var(--ink2)}
.panel{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);min-width:0}
.pcard{border-top:5px solid var(--blue);padding-top:14px;display:grid;gap:10px}
.pcard h3{font-size:26px;line-height:1.12}
.pcard .where{font-size:13.5px;color:var(--ink2);font-weight:600}
.pcard .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,5vw,54px);color:var(--blue);line-height:1}
.pcard .big small{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--ink2);margin-left:6px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.facts div{padding:10px 8px 10px 0;display:grid;gap:2px}.facts div+div{padding-left:10px;border-left:1.5px solid var(--rule)}
.facts b{font-family:var(--display);font-size:22px;font-weight:800}
.facts span{font-size:12px;color:var(--ink2);line-height:1.35}
.finder{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.field{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2);min-width:0}
.field input,.field select{font:500 16px var(--ui);padding:11px 12px;border:2px solid var(--ink);background:#fff;color:var(--ink);min-width:0;border-radius:0}
#street{width:min(320px,100%)} #number{width:96px}
.msg{font-size:13.5px;color:var(--ink2);min-height:20px}
@media (max-width:900px){.atlas{grid-template-columns:minmax(0,1fr)}.panel{position:static}}

/* relatório */
.mov{width:100%;border-collapse:collapse;font-size:15px}
.mov th{font-size:12px;text-transform:uppercase;letter-spacing:.1em;text-align:left;color:var(--ink2);padding:8px 10px;border-bottom:2px solid var(--ink)}
.mov td{padding:12px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.mov td.n{white-space:nowrap;font-weight:700}
.mov .up{color:#0A7A3E}.mov .down{color:var(--red)}
.mov .note{font-size:13.5px;color:var(--ink2)}
.tablewrap{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:30px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--soft);padding:22px;border-left:8px solid var(--blue);display:grid;gap:12px;align-content:start;align-self:start}
.box.red{border-left-color:var(--red)}
.box h3{font-size:22px}

/* forte */
.forte{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:center}
.forte .phrase{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.15}
.forte ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.forte li{padding-left:22px;position:relative;font-size:16.5px}
.forte li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;background:var(--red)}
@media (max-width:860px){.forte{grid-template-columns:minmax(0,1fr)}}

/* dicas */
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.tip{border:1.5px solid var(--ink);padding:18px;display:grid;gap:8px;align-content:start;position:relative}
.tip .n{font-family:var(--display);font-weight:800;font-size:34px;color:var(--red);line-height:1}
.tip h3{font-family:var(--ui);font-size:17px;font-weight:800}

/* artigo */
.article{max-width:760px;display:grid;gap:16px;font-size:18px}
.article p:first-child::first-letter{font-family:var(--display);font-weight:800;float:left;font-size:64px;line-height:.8;padding:6px 8px 0 0;color:var(--blue)}

/* notícias */
.news{display:grid;gap:0;border-top:2px solid var(--ink)}
.news article{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--rule)}
.news .d{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.04em}
.news h3{font-family:var(--ui);font-size:18px;font-weight:800;line-height:1.3}
.news .src{font-size:13px;color:var(--ink2);margin-top:6px}
@media (max-width:560px){.news article{grid-template-columns:minmax(0,1fr);gap:4px}}
.cta-poll{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--blue);color:#fff;padding:22px 24px;margin-top:26px;text-decoration:none;position:relative;overflow:hidden}
.cta-poll::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:110px;background:var(--red);transform:skewX(-22deg)}
.cta-poll *{position:relative;z-index:1}
.cta-poll strong{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);display:block}
.cta-poll span{font-size:14.5px;opacity:.9}
.cta-poll .go{font-weight:800;font-size:15px;white-space:nowrap}
@media (max-width:560px){.cta-poll{grid-template-columns:minmax(0,1fr)}}

/* história */
.tl{display:grid;gap:0;border-left:4px solid var(--blue);margin-left:6px}
.tl div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:12px 0 12px 20px;position:relative}
.tl div::before{content:"";position:absolute;left:-11px;top:18px;width:18px;height:18px;background:var(--red)}
.tl b{font-family:var(--display);font-size:20px;color:var(--blue)}
@media (max-width:560px){.tl div{grid-template-columns:minmax(0,1fr);gap:2px}}

/* contato */
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:26px;align-items:center}
.contact img{width:140px;height:140px;object-fit:cover;border:5px solid #fff}
.contact h2{font-size:clamp(30px,4vw,42px)}
.contact .lines{display:grid;gap:4px;font-size:15px}
.contact .ph{font-size:22px;font-weight:800}
@media (max-width:760px){.contact{grid-template-columns:minmax(0,1fr)}}
.foot{padding-block:24px 40px;font-size:13px;color:var(--ink2);display:grid;gap:8px}
.nota-m2{border-left:4px solid var(--red);background:#F1F4F9;padding:12px 14px;line-height:1.55;color:var(--ink)}
.ast{color:var(--red);text-decoration:none;font-weight:800}
sup .ast{font-size:.55em}
.iptu{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:4px;font-weight:500}
#p-big .iptu{font-family:'Libre Franklin',system-ui,sans-serif;font-size:12.5px;letter-spacing:0;line-height:1.4;margin-top:6px}

/* nomes de ruas */
.st-l text{font-family:var(--ui);paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
.st-l .m{font-size:11.5px;font-weight:700;fill:var(--ink);letter-spacing:.01em}
.st-l .l{font-size:10.5px;font-weight:500;fill:var(--ink2)}
.st-l g.off{display:none}
/* lugares especiais */
:root{--c-cafe:#0047AB;--c-padaria:#DC1C2E;--c-arte:#A8741A;--c-cultura:#1F7A5A;--c-marco:#5B3A8E}
.guia{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px;margin-bottom:22px}
.gcat{border:1.5px solid var(--ink);background:#fff;padding:16px 18px;display:grid;gap:6px;align-content:start;border-top:7px solid var(--cc)}
.gcat b{font-family:var(--display);font-size:21px;line-height:1.15}
.gcat .n{font-size:13px;font-weight:800;color:var(--cc);letter-spacing:.08em;text-transform:uppercase}
.gcat span{font-size:14.5px;color:var(--ink2)}
.guia-go{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
#lugares-view{padding-block:30px 60px}
#lugares-view .head{display:grid;gap:12px;max-width:760px;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chips button{font:700 14px/1 var(--ui);padding:10px 14px;min-height:42px;border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--blue);color:#fff}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:18px}
.lcard{border:1.5px solid var(--ink);background:#fff;display:grid;grid-template-rows:auto 1fr auto;min-width:0;box-shadow:inset 6px 0 0 var(--cc)}
.lcard .in{padding:18px 18px 12px 24px;display:grid;gap:7px;align-content:start}
.lcard .cat{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cc)}
.lcard h3{font-size:22px;line-height:1.15}
.lcard .end{font-size:14px;font-weight:600;color:var(--ink2)}
.lcard p{font-size:15.5px}
.lcard .hr{font-size:13.5px;color:var(--muted)}
.lcard .acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 18px 24px}
.lcard .acts .btn{font-size:14px;padding:11px 14px;min-height:42px;text-decoration:none}
.lugp{cursor:pointer}
.lugp text{display:none;font-family:var(--ui);font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
svg.zk .lugp text,.lugp.on text{display:block}
.lugp.on circle{stroke:var(--ink);stroke-width:3}

/* enquete planos */
#planos-view{padding-block:30px 60px}
.poll{max-width:720px;display:grid;gap:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--ink);padding:14px 16px;cursor:pointer;font-weight:600;font-size:16.5px;background:#fff}
.opt input{width:20px;height:20px;accent-color:var(--blue)}
.opt:has(input:checked){background:var(--soft);border-color:var(--blue);box-shadow:inset 6px 0 0 var(--blue)}
.optin{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.optin input{width:22px;height:22px;accent-color:var(--red);margin-top:2px;flex:none}
.res{display:grid;gap:8px}
.res .row{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:14.5px;font-weight:600}
.res .bar{height:12px;background:var(--soft2);grid-column:1/-1;margin-top:-4px}
.res .bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.res .row.me .bar i{background:var(--red)}

/* animação de entrada */
.rise{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rise.on{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;transform:none;transition:none}.track .mk,.track .fill,.res .bar i{transition:none}}
</style>
</head>

<div class="top"><div class="wrap"><span id="t-top">ANDREA LONGOBARDI · RE/MAX VERTI</span><span class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="pt">PT</button><button type="button" data-l="en">EN</button></span></div></div>

        <label class="field" style="flex:0 0 96px"><span id="t-g-num"></span><input id="g-num" inputmode="numeric"></label>
      </div>
      <div class="where" id="g-where" hidden style="font-weight:700;color:var(--ink2)"></div>
      <div class="small" id="t-g-drag" style="font-weight:700;color:var(--ink2);margin-top:4px"></div>
      <div class="val num" id="g-val">R$ 9.000</div>
      <div class="thermo" id="g-thermo">
        <div class="bulb" aria-hidden="true"></div>
        <div class="tube" aria-hidden="true"><div class="merc" id="g-merc"></div><div class="ticks" id="g-ticks"></div></div>
        <div class="realmk" id="g-realmk" hidden><span></span></div>
        <div class="knob" id="g-knob" aria-hidden="true"><i></i><i></i><i></i></div>
        <input type="range" id="g-range" min="5000" max="30000" step="100" value="12000" aria-labelledby="t-g-h">
      </div>
      <div class="scale num" id="g-scale"></div>
      <button class="btn red" type="submit" id="g-next"></button>
      <div class="msg" id="g-msg" role="status"></div>
    </form>
    <div id="g-step2" hidden style="display:grid;gap:12px">
      <button class="btn red" type="button" id="g-go"></button>
      <button class="btn alt" type="button" id="g-other" style="justify-self:start"></button>
    </div>
    <div class="reveal" id="g-reveal" hidden>
      <div class="track" id="g-track" style="margin:24px 0 26px"><div class="fill" id="g-fill"></div><div class="mk real" id="g-real"><span></span></div><div class="mk you" id="g-you"><span></span></div></div>
      <div class="verdict" id="g-verdict"></div>
      <div class="small" id="g-crowd"></div>
      <a class="btn alt" href="#mapa" id="g-cta" style="text-decoration:none;justify-self:start"></a>
    </div>
  </div>
</section>

  <div class="sec-h rise"><div class="sq"></div><h2 id="t-p-h"></h2><p id="t-p-p"></p></div>
  <div class="dash-tools"><div class="seg" role="group" id="subseg"></div><div class="small" id="t-p-note"></div></div>

  </div>
</div></section>

      <div class="zoombar"><button type="button" id="zin" aria-label="+">+</button><button type="button" id="zout" aria-label="−">−</button><button type="button" id="zreset" aria-label="reset" style="font-size:14px">◎</button></div>
      <div class="legend" id="legend" aria-hidden="true"></div>
    </div>

        <div class="k" id="p-k"></div>

        <div class="small" id="p-note"></div>
      </div>
      <div class="box red"><h3 id="t-cta-h"></h3><p id="t-cta-p"></p><p class="num" style="font-weight:800;color:var(--blue);font-size:19px">+55 11 95439-5027</p></div>
    </aside>
  </div>
</div></section>

e gatehouse, monitoring and condo fees together with the property. Keep the meeting minutes, the budget and the history of special assessments at hand."}},{"t":{"pt":"Studios no Jardim Panorama","en":"Studios in Jardim Panorama"},"d":{"pt":"Prédios novos de studios, como o da Rua Pacobá 71 (2023), concentram muitas vendas e puxam a média do m² do Panorama para outro patamar. Compare studios com studios e observe a oferta concorrente no mesmo prédio, onde várias unidades costumam estar à venda ao mesmo tempo.","en":"New studio buildings, such as Rua Pacobá 71 (2023), concentrate many sales and shift Panorama's average price per m² onto a different level. Compare studios with studios and watch competing supply in the same building, where several units are often listed at once."}},{"t":{"pt":"Acompanhe os projetos do entorno","en":"Follow nearby projects"},"d":{"pt":"O plano do Jockey Club, a expansão do Shopping Cidade Jardim e a Ciclopassarela Panorama ainda dependem de aprovações e prazos. Para quem compra, vale tratar esses projetos como potencial de valorização, sem pagar por eles antes que saiam do papel.","en":"The Jockey Club plan, the Shopping Cidade Jardim expansion and the Panorama bridge still depend on approvals and schedules. Buyers can treat them as upside potential while avoiding paying for them before they materialize."}}]},"relatorio":{"titulo":{"pt":"Relatório residencial e comercial","en":"Residential and commercial report"},"intro":{"pt":"Comparação entre 2021–2022 e 2025–2026, com as guias de ITBI pagas na Prefeitura. A variação de volume usa a média de vendas por mês.","en":"Comparison between 2021–2022 and 2025–2026, using the property-transfer tax (ITBI) records from the City. Volume change uses average sales per month."},"notas":{"apto":{"pt":"O m² ficou praticamente estável (−2,1%), com volume de vendas 87% maior, puxado por prédios novos.","en":"Price per m² was nearly flat (−2.1%), while sales volume rose 87%, driven by new buildings."},"ca Jockey Club presented to the City Council a plan for a new club and an 85,000 m² public-use park with leisure, dining and retail, still pending approvals (São Paulo City Council)."}]},"artigo":{"titulo":{"pt":"Onde estão as oportunidades","en":"Where the opportunities are"},"paragrafos":[{"pt":"Nos 12 meses até agosto de 2026, os registros de ITBI mostram cerca de 158 vendas residenciais e comerciais na região, perto de 13 por mês, com mediana de R$ 4,26 milhões por apartamento. A diferença entre os três bairros é grande: o m² privativo estimado gira em torno de R$ 36.700 em Cidade Jardim, R$ 22.100 no Jardim Guedala e R$ 10.300 no Jardim Panorama, onde há muitos studios novos, como os da Rua Pacobá 71. Para o comprador, isso abre portas de entrada bem distintas dentro do mesmo endereço.","en":"In the 12 months to August 2026, ITBI records show about 158 residential and commercial sales in the area, close to 13 a month, with a median apartment price of R$ 4.26 million. The gap between the three neighborhoods is wide: the estimated private-area price per m² is around R$ 36,700 in Cidade Jardim, R$ 22,100 in Jardim Guedala and R$ 10,300 in Jardim Panorama, which has many new studios, such as those at Rua Pacobá 71. For buyers, this creates very different entry points within the same address."},{"pt":"As casas são o segmento que mais se valorizou: o m² subiu 63% entre 2021–22 e 2025–26, com cerca de 6 vendas por mês, o que favorece proprietários de terrenos amplos. Nos apartamentos, o volume cresceu 87% com preço por m² praticamente estável (−2,1%), sustentado por prédios recentes como Rua Dr. Bruno Rangel Pestana 21 (2022), Rua Prof. Dr. Antônio Barros de Ulhoa Cintra 168 (2023) e Av. dos Tajuras 333 (2023), além do Parque Cidade Jardim (Av. Magalhães de Castro 12000). Esse cenário de muita liquidez e preço contido tende a favorecer quem compra apartamento com tempo para negociar.","en":"Houses are the segment that gained the most: price per m² rose 63% between 2021–22 and 2025–26, with about 6 sales a month, which favors owners of large lots. For apartments, volume grew 87% with price per m² nearly flat (−2.1%), supported by recent buildings such as Rua Dr. Bruno Rangel Pestana 21 (2022), Rua Prof. Dr. Antônio Barros de Ulhoa Cintra 168 (2023) and Av. dos Tajuras 333 (2023), as well as Parque Cidade Jardim (Av. Magalhães de Castro 12000). This mix of strong liquidity and restrained prices tends to favor apartment buyers who have time to negotiate."},{"pt":"Três projetos merecem acompanhamento. A Ciclopassarela Panorama, com R$ 132,8 milhões da Operação Urbana Faria Lima, deve ligar o Jardim Panorama à estação Berrini e reduzir o trajeto para cerca de 4 minutos (Metrô CPTM; Diário do Transporte). O plano do Jockey Club prevê um parque de uso público de 85 mil m² (Câmara Municipal de São Paulo), e o Shopping Cidade Jardim amplia sua área para cerca de 52 mil m² (Mercado & Consumo). Como todos ainda dependem de contratos, aprovações ou obras, o mais prudente é tratá-los como potencial adicional, ainda fora do preço atual.","en":"Three projects are worth watching. The Panorama pedestrian and cycle bridge, funded with R$ 132.8 million from the Faria Lima Urban Operation, is set to link Jardim Panorama to Berrini station and cut the trip to about 4 minutes (Metrô CPTM; Diário do Transporte). The Jockey Club plan includes an 85,000 m² public-use park (São Paulo City Council), and Shopping Cidade Jardim is expanding to about 52,000 m² (Mercado & Consumo). Since all of them still depend on contracts, approvals or construction, the prudent approach is to treat them as additional potential, still outside current prices."}]},"noticias":{"titulo":{"pt":"Pesquisa e notícias","en":"Research and news"},"nota":{"pt":"Cada notícia foi conferida em duas fontes.","en":"Each news item was checked against two sources."},"itens":[{"data":"2026-10","t":{"pt":"Jockey Club apresenta plano com BTG para quitar dívida e criar parque de 85 mil m²","en":"Jockey Club presents BTG-backed plan to settle debt and create an 85,000 m² park"},"d":{"pt":"Em 13 de outubro, o Jockey Club levou à CPI da Câmara Municipal um acordo com o BTG Pactual para pagar cerca de R$ 228 milhões à Prefeitura, valor resultante dos descontos do Programa de Transação Tributária. O plano prevê um novo clube para cerca de 14 mil frequentadores e um parque de uso público de 85 mil m², e ainda depende da aprovação do conselho do clube.","en":"On October 13, the Jockey Club presented to a City Council inquiry commission a deal with BTG Pactual to pay about R$ 228 million to the City, an amount reached through discounts under the municipal tax settlement program. The plan includes a new club for about 14,000 users and an 85,000 m² public-use park, and still requires approval from the club's board."},"f":[["Câmara Municipal de São Paulo","https://www.saopaulo.sp.leg.br/blog/jockey-club-anuncia-acordo-com-instituicao-financeira-para-quitar-divida-com-a-cidade-de-sao-paulo/"],["Correio da Manhã","https://www.correiodamanha.com.br/nacional/sao-paulo/2026/10/326825-jockey-anuncia-acordo-para-quitar-divida-municipal.html"]]},{"data":"2026-09","t":{"pt":"Ciclopassarela Panorama recebe R$ 132,8 milhões para ligar o bairro à estação Berrini","en":"Panorama bridge gets R$ 132.8 million to link the neighborhood to Berrini station"},"d":{"pt":"A Prefeitura formalizou em setembro R$ 132,8 milhões da Operação Urbana Faria Lima para a Ciclopassarela Panorama, travessia de cerca de 515 metros para pedestres e ciclistas sobre o Rio Pinheiros e a Marginal. A estrutura ligará o Jardim Panorama à região da estação Berrini da Linha 9-Esmeralda, e a SPObras conduz a contratação da obra.","en":"In September, the City formalized R$ 132.8 million from the Faria Lima Urban Operation for the Panorama pedestrian and cycle bridge, a crossing of about 515 meters over the Pinheiros River and its expressway. It will link Jardim Panorama to the area around Berrini station on Line 9-Emerald, and SPObras is handling the construction contract."},"f":[["Diário do Transporte","https://diariodotransporte.com.br/2026/09/09/prefeitura-de-sao-paulo-formaliza-r-1328-milhoes-para-ciclopassarela-panorama-e-spobras-homologa-consorcio-vencedor/"],["Metrô CPTM","https://www.metrocptm.com.br/prefeitura-libera-verba-para-ciclopassarela-da-estacao-berrini-da-linha-9/"]]},{"data":"2026-09","t":{"pt":"Shopping Cidade Jardim abre a CJ Fashion, loja de departamento de 4 mil m²","en":"Shopping Cidade Jardim opens CJ Fashion, a 4,000 m² department store"},"d":{"pt":"A JHSF inaugurou em 26 de setembro a CJ Fashion, loja de departamento de luxo com mais de 4 mil m² em três andares dentro do Shopping Cidade Jardim. O espaço reúne cerca de 150 marcas nacionais e internacionais e faz parte da maior expansão da história do shopping.","en":"On September 26, JHSF opened CJ Fashion, a luxury department store of more than 4,000 m² over three floors inside Shopping Cidade Jardim. It brings together about 150 Brazilian and international brands and is part of the largest expansion in the mall's history."},"f":[["Mercado & Consumo","https://mercadoeconsumo.com.br/25/09/2026/shopping-centers/jhsf-inaugura-loja-de-departamento-de-4-mil-m%C2%B2-em-shopping-de-sp/amp/"],["InvestNews","https://investnews.com.br/negocios/jhsf-loja-departamento-cidade-jardim/amp/"]]},{"data":"2026-07","t":{"pt":"Fundo capta R$ 400 milhões e amplia participação no Shopping Cidade Jardim","en":"Fund raises R$ 400 million and increases its stake in Shopping Cidade Jardim"},"d":{"pt":"A JHSF Capital captou R$ 400 milhões com a oferta do fundo imobiliário JCSC11, com demanda acima do volume ofertado, para adquirir uma fatia do Shopping Cidade Jardim. Com a operação, os fundos geridos pela JHSF Capital passaram a deter 49,99% do shopping.","en":"JHSF Capital raised R$ 400 million through the offering of the JCSC11 real estate fund, with demand above the amount offered, to acquire a stake in Shopping Cidade Jardim. With the deal, funds managed by JHSF Capital now hold 49.99% of the mall."},"f":[["Forbes Brasil","https://forbes.com.br/forbes-money/forbes-real-estate/2026/07/jhsf-capital-shopping-cidade-jardim/"],["Finance News","https://financenews.com.br/2026/07/jhsf-fundos-geridos-pela-jhsf-capital-atingem-4999-de-participacao-no-shopping-cidade-jardim/print/"]]}]},"historia":{"titulo":{"pt":"Um pouco de história","en":"A bit of history"},"itens":[{"ano":"1927","pt":"A companhia Cidade Jardim compra uma grande gleba às margens do Rio Pinheiros e começa a lotear a área para as classes média e alta.","en":"The Cidade Jardim company buys a large tract on the banks of the Pinheiros River and begins subdividing it for middle- and upper-class buyers."},{"ano":"1940","pt":"A Companhia Imobiliária Morumby começa a vender os lotes de uma antiga fazenda de chá da região, com regras que proibiam áreas comerciais.","en":"Companhia Imobiliária Morumby begins selling lots from a former tea farm in the area, under rules that barred commercial uses."},{"ano":"1941","pt":"Em 25 de janeiro é inaugurado o Hipódromo de Cidade Jardim, projeto de Elisário Bahiana, para onde o Jockey Club transfere sua sede vinda da Mooca.","en":"On January 25, the Cidade Jardim Racecourse, designed by Elisário Bahiana, opens and the Jockey Club moves its headquarters there from Mooca."},{"ano":"1950s","pt":"O loteamento da antiga Fazenda Morumbi dá origem a bairros-jardim como o Jardim Guedala e o Jardim Panorama.","en":"The subdivision of the former Fazenda Morumbi gives rise to garden neighborhoods such as Jardim Guedala and Jardim Panorama."},{"ano":"1971","pt":"É inaugurado o Parque Alfredo Volpi, antigo Bosque do Morumbi, que hoje soma cerca de 131 mil m² de área verde.","en":"Alfredo Volpi Park, the former Bosque do Morumbi, opens; today it covers about 131,000 m² of green space."},{"ano":"2010","pt":"O conjunto do Hipódromo de Cidade Jardim é tombado pelo Estado de São Paulo, por resolução de 19 de novembro.","en":"The Cidade Jardim Racecourse complex is listed as heritage by the State of São Paulo, by a resolution dated November 19."}],"fontes":[["Wikipédia – Cidade Jardim (bairro de São Paulo)","https://pt.wikipedia.org/wiki/Cidade_Jardim_(bairro_de_S%C3%A3o_Paulo)"],["Wikipedia – São Paulo Jockey Club","https://en.wikipedia.org/wiki/S%C3%A3o_Paulo_Jockey_Club"],["Prefeitura de São Paulo – Parque Alfredo Volpi","https://prefeitura.sp.gov.br/web/meio_ambiente/w/parques/regiao_centrooeste/5729"]]},"pois":{"shopcj":{"pt":"Shopping Cidade Jardim","en":"Shopping Cidade Jardim","k":"shop"},"jockey":{"pt":"Jockey Club","en":"Jockey Club","k":"shop"},"volpi":{"pt":"Parque Alfredo Volpi","en":"Alfredo Volpi Park","k":"shop"},"oscar":{"pt":"Fundação Oscar Americano","en":"Oscar Americano Foundation","k":"shop"},"bandeirantes":{"pt":"Palácio dos Bandeirantes","en":"Bandeirantes Palace","k":"shop"},"einstein":{"pt":"Hospital Einstein","en":"Einstein Hospital","k":"shop"}},"exemplo_rua":"Av. das Magnólias","nota_vendas":{"pt":"Na região, as casas respondem por boa parte das vendas.","en":"Houses account for a large share of sales in this area."}}</script>
