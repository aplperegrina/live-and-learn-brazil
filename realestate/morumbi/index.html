/* Boletim de bairro: jornal de dados, ardósia azulada, goiaba e amarelo fechado; fontes e cartões do dashboard */
:root{
  --bg:#FBFCF8; --ink:#232B3A; --ink2:#3A4458; --muted:#56607A; --rule:#D5DAE3; --soft:#F6F9FF; --soft2:#E6EBF3;
  --blue:#34425E; --blue2:#4F6488; --blue3:#8E9DBB; --red:#E0604E; --red2:#F9DDD6;
  --yel:#C99A1F; --yeltx:#8C6A00; --champ:#DCC792; --slate:#3E495F; --onslate:#C3CAD6;
  --q1:#E2E7F0; --q2:#BAC4D7; --q3:#8796B3; --q4:#566A8E; --q5:#2E3B55; --q0:#EEF0F4; --h1:#F3E7D3; --h2:#E2C89C; --h3:#BF9454;
  --display:'Libertinus Sans', 'Segoe UI', Arial, sans-serif;
  --ui:'Open Sans', 'Segoe UI', Arial, sans-serif;
  --narrow:'PT Sans Narrow', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;font-weight:500;line-height:1.6;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue2)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.k{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.btn{font:700 15px/1 var(--ui);padding:14px 20px;border:0;background:var(--blue);color:#fff;cursor:pointer;min-height:46px;border-radius:0}
.btn.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.red{background:var(--red)}
.seg{display:inline-flex;border:2px solid var(--blue);flex-wrap:wrap}
.seg button{font:700 14px/1 var(--ui);padding:10px 14px;border:0;background:#fff;color:var(--blue);cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* barra superior */
.top{background:var(--slate);color:#fff;position:relative;overflow:hidden;border-bottom:2px solid var(--champ)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px;font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.1em}
.top::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:180px;background:var(--red);transform:skewX(-24deg)}
.top .wrap>*{position:relative;z-index:1}
.lang{display:inline-flex;border:1.5px solid var(--champ);background:rgba(255,255,255,.06)}
.lang button{background:transparent;color:#fff;border:0;font:700 15px/1 var(--narrow);padding:8px 14px;cursor:pointer;min-height:38px;letter-spacing:.12em}
.lang button[aria-pressed="true"]{background:var(--champ);color:var(--slate)}

/* cabeçalho */
.mast{border-bottom:3px solid var(--ink);padding-block:22px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:end}
.mast .bar{width:12px;align-self:stretch;background:var(--red)}
.mast .name{font-family:var(--display);font-weight:800;font-size:clamp(38px,6.4vw,74px);line-height:.95}
.mast .name span{color:var(--slate)}
.mast .meta{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--ink2);text-align:right;display:grid;gap:3px}
@media (max-width:640px){.mast{grid-template-columns:auto minmax(0,1fr)}.mast .meta{grid-column:1/-1;text-align:left}}

/* abertura + adivinhe */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:34px;padding-block:38px 42px;align-items:start;position:relative;background:var(--slate);box-shadow:0 0 0 100vmax var(--slate);clip-path:inset(0 -100vmax);color:#FAF9F4;border-top:2px solid var(--champ);border-image:linear-gradient(var(--champ) 0 0) 1 / 2px 0 0 0 / 0 100vmax}
.hero .small{color:var(--onslate)} .hero a{color:var(--champ)}
.hero h1{font-size:clamp(34px,4.8vw,56px);line-height:1.08;color:#FAF9F4}
.hero .lead{font-size:20px;color:var(--onslate);margin-top:14px;max-width:34em}
.guess{position:relative;background:var(--soft);color:var(--ink);padding:26px 24px 24px;border-top:6px solid var(--champ);display:grid;gap:14px}
.guess::before{content:"";position:absolute;right:0;top:-6px;width:34%;height:6px;background:var(--red)}
.guess h2{font-size:26px;line-height:1.15}
.guess .val{font-family:var(--display);font-weight:800;font-size:clamp(33px,4.2vw,49px);color:var(--blue);line-height:1}
.thermo{--tw:30px;--p:.3;position:relative;height:54px;margin:30px 0 0;padding-left:38px}
.thermo .bulb{position:absolute;left:0;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F59A88,var(--red) 60%,#B4432F);box-shadow:0 0 0 5px #fff,0 0 0 7px var(--ink)}
.thermo .tube{position:absolute;left:34px;right:0;top:50%;height:22px;margin-top:-11px;background:#fff;border-radius:0 11px 11px 0;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden}

.cm-range::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--red) calc(var(--p)*100%),var(--soft2) 0);box-shadow:inset 0 0 0 1px rgba(62,73,95,.18)}
.cm-range::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--red) calc(var(--p)*100%),var(--soft2) 0);box-shadow:inset 0 0 0 1px rgba(62,73,95,.18)}
.cm-range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 2px 8px rgba(52,66,94,.35)}
.cm-range::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 2px 8px rgba(52,66,94,.35)}
.cm-range:focus-visible{outline:none}.cm-range:focus-visible::-webkit-slider-thumb{outline:3px solid var(--red);outline-offset:2px}
.cm-scale{display:flex;justify-content:space-between;font-family:var(--narrow);font-size:15px;font-weight:700;color:var(--muted);margin-top:-6px}
.cm-chips{display:flex;flex-wrap:wrap;gap:8px}
.cm-chips button{font:700 15px/1 var(--narrow);letter-spacing:.04em;padding:10px 14px;min-height:42px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;border-radius:21px}
.cm-chips button[aria-pressed="true"]{background:var(--blue);color:#fff}
.compra-res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;align-self:center;min-width:0}
.cm-plan svg{width:min(210px,40vw);height:auto;display:block;overflow:visible}
.cm-leg{font-family:var(--narrow);font-size:14.5px;font-weight:700;color:var(--muted);margin-top:6px;max-width:220px;line-height:1.5}
.cm-leg span{display:inline-block;width:14px;height:10px;margin:0 5px 0 0;vertical-align:-1px}.cm-leg .a{background:rgba(52,66,94,.14);border:2px solid #34425E}.cm-leg .b{border:2px dashed #8E9DBB;margin-left:10px}
.cm-plan text{font-family:var(--narrow);font-size:15px;font-weight:700;fill:var(--ink2)}
.cm-big{font-family:var(--display);font-weight:700;font-size:clamp(52px,7vw,84px);line-height:.95;color:var(--blue)}
.cm-big small{font-size:.45em;margin-left:4px}
#cm-sub{font-size:15.5px;color:var(--ink2);margin-top:8px}
.cm-rows{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px 40px;border-top:1px solid var(--champ);padding-top:18px}
.cm-g h3{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.cm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;margin-bottom:9px;font-size:15px}
.cm-row span{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-row b{font-family:var(--display);font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums}
.cm-row i{grid-column:1/-1;display:block;height:8px;background:var(--soft2);border-radius:4px;overflow:hidden}
.cm-row i em{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cm-row.sm i em{background:var(--blue3)}
#cm-note{grid-column:1/-1}
@media (max-width:900px){.compra{grid-template-columns:minmax(0,1fr);padding:24px 18px 20px}.compra-res{grid-template-columns:minmax(0,1fr)}.cm-plan svg{width:min(190px,60vw)}}
@media (prefers-reduced-motion: reduce){.cm-in.hint{animation:none}.cm-row i em{transition:none}}

/* animação de entrada */
.rise{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rise.on{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;transform:none;transition:none}.track .mk,.track .fill,.res .bar i{transition:none}}
</style>
</head>

<script id="C" type="application/json">{"prep":"no","edicao":{"pt":"Edição outubro–novembro de 2026","en":"October–November 2026 edition"},"dados_ate":{"pt":"Vendas registradas até agosto de 2026","en":"Sales recorded through August 2026"},"area_desc":{"pt":"Vila Progredior, Caxingui, Jardim Previdência e Jardim Leonor, entre as avenidas Francisco Morato, Padre Lebret e Albert Einstein, servidos pelas estações São Paulo-Morumbi e Butantã da Linha 4-Amarela.","en":"Vila Progredior, Caxingui, Jardim Previdência and Jardim Leonor, between Francisco Morato, Padre Lebret and Albert Einstein avenues, served by the São Paulo-Morumbi and Butantã stations of Metro Line 4-Yellow."},"subareas":{"todos":{"pt":"Região toda","en":"Whole area"},"progredior":{"pt":"Vila Progredior e Caxingui","en":"Vila Progredior & Caxingui"},"leonor":{"pt":"Jardim Leonor","en":"Jardim Leonor"}},"forte":{"titulo":{"pt":"O forte do bairro","en":"The neighborhood's strength"},"frase":{"pt":"Bairros residenciais consolidados, ligados ao metrô e vizinhos de grandes polos como o Hospital Einstein, o MorumBIS e o Palácio dos Bandeirantes.","en":"Established residential neighborhoods with metro access, next to major hubs such as Einstein Hospital, the MorumBIS stadium and the Palácio dos Bandeirantes."},"itens":[{"pt":"Duas estações da Linha 4-Amarela atendem a região: Butantã e São Paulo-Morumbi, inaugurada em outubro de 2018.","en":"Two Line 4-Yellow stations serve the area: Butantã and São Paulo-Morumbi, opened in October 2018."},{"pt":"O Hospital Israelita Albert Einstein funciona no Jardim Leonor desde 1971 e concentra serviços de saúde e empregos no entorno.","en":"Albert Einstein Israelite Hospital has operated in Jardim Leonor since 1971 and anchors healthcare services and jobs nearby."},{"pt":"Entre 2021–22 e 2025–26, o m² dos apartamentos subiu 13,9% com volume de vendas estável (ITBI).","en":"Between 2021–22 and 2025–26, apartment prices per m² rose 13.9% with a stable sales volume (ITBI records)."},{"pt":"A oferta é variada: grandes condomínios dos anos 1970, prédios dos anos 2010 e 2020 e casas em ruas residenciais.","en":"The housing stock is varied: large 1970s complexes, buildings from the 2010s and 2020s, and houses on residential streets."}]},"dicas":{"titulo":{"pt":"Dicas para quem vai vender ou comprar","en":"Tips for sellers and buyers"},"itens":[{"t":{"pt":"Área do IPTU e área privativa","en":"Tax-record area and private area"},"d":{"pt":"A Prefeitura registra a área do IPTU, que inclui áreas comuns e vagas, e os anúncios usam a área privativa. Na hora de comparar preços, confira sempre qual das duas áreas está sendo usada. Neste boletim, os números principais estimam a área privativa e o valor pelo IPTU aparece ao lado.","en":"The City records the tax-record (IPTU) area, which includes common areas and parking, while listings use the private area. When comparing prices, always check which of the two areas is being used. Here, the headline figures estimate the private area and the IPTU-based value appears alongside."}},{"t":{"pt":"Compare dentro do mesmo condomínio","en":"Compare within the same complex"},"d":{"pt":"Grandes conjuntos, como o da Av. Prof. Francisco Morato, 2203 (1975), somam muitas vendas registradas e oferecem boas referências de preço. Compare unidades da mesma torre e metragem, e ajuste pelo estado de conservação, andar e valor do condomínio.","en":"Large complexes, such as the one at Av. Prof. Francisco Morato 2203 (1975), have many recorded sales and provide solid price references. Compare units in the same tower and size, then adjust for condition, floor and condominium fee."}},{"t":{"pt":"Calendário do MorumBIS","en":"MorumBIS event calendar"},"d":{"pt":"Em dias de jogos e shows, as vias do entorno do estádio têm bloqueios e o acesso pode ficar restrito a moradores cadastrados. Agende visitas fora dessas datas e informe o comprador sobre a rotina de eventos e o cadastro de moradores.","en":"On match and concert days, streets around the stadium are closed and access may be limited to registered residents. Schedule viewings outside those dates and tell buyers about the event routine and resident registration."}},{"t":{"pt":"Obras na Francisco Morato","en":"Works on Francisco Morato"},"d":{"pt":"A extensão da Linha 4-Amarela até Taboão da Serra traz canteiros e desvios na avenida, sobretudo no trecho da Vila Sônia, previstos para cerca de cinco anos. Verifique rotas de acesso ao imóvel e considere o benefício futuro das novas estações na avaliação.","en":"The Line 4-Yellow extension to Taboão da Serra brings work sites and detours on the avenue, especially in the Vila Sônia stretch, expected to last about five years. Check access routes to the property and weigh the future benefit of the new stations in the valuation."}},{"t":{"pt":"Drenagem e histórico da rua","en":"Drainage and street history"},"d":{"pt":"Partes da região, perto do Córrego Antonico, recebem um sistema de piscinões em obras. Pergunte ao condomínio e aos vizinhos sobre o histórico de alagamentos e acompanhe a entrega dos reservatórios.","en":"Parts of the area near the Antonico stream are receiving a reservoir system now under construction. Ask the building management and neighbors about past flooding and follow the delivery of the reservoirs."}}]},"relatorio":{"titulo":{"pt":"Relatório residencial e comercial","en":"Residential and commercial report"},"intro":{"pt":"Comparação entre 2021–2022 e 2025–2026, com as guias de ITBI pagas na Prefeitura. A variação de volume usa a média de vendas por mês.","en":"Comparison between 2021–2022 and 2025–2026, using the property-transfer tax (ITBI) records from the City. Volume change uses average sales per month."},"notas":{"apto":{"pt":"O m² subiu 13,9% com volume de vendas praticamente estável (−1%), o que indica demanda firme.","en":"Price per m² rose 13.9% with a nearly stable sales volume (−1%), which points to steady demand."},"casa":{"pt":"O m² subiu 19,7% e o número de vendas caiu 30%, com oferta de casas mais restrita.","en":"Price per m² rose 19.7% while the number of sales fell 30%, with a tighter supply of houses."},"escritorio":{"pt":"O m² subiu 19% e o volume caiu 42%; com poucas vendas, a variação deve ser lida com cautela.","en":"Price per m² rose 19% and volume fell 42%; with very few sales, the change should be read with caution."}},"comercial_titulo":{"pt":"Comércio e serviços","en":"Retail and services"},"comercial":[{"pt":"A Av. Prof. Francisco Morato é o principal eixo comercial da região, com supermercados, shopping, concessionárias, farmácias e serviços de bairro ao longo de um corredor que liga o Butantã à Vila Sônia e a Taboão da Serra. A extensão da Linha 4-Amarela, que deve atender mais de 50 mil passageiros por dia entre Taboão da Serra e o centro (Diário do Transporte), tende a reforçar o fluxo de pessoas nesse eixo.","en":"Av. Prof. Francisco Morato is the area's main commercial axis, with supermarkets, a shopping mall, car dealerships, pharmacies and neighborhood services along a corridor that links Butantã to Vila Sônia and Taboão da Serra. The Line 4-Yellow extension, expected to serve more than 50,000 passengers a day between Taboão da Serra and downtown (Diário do Transporte), is likely to strengthen foot traffic along this axis."},{"pt":"No Jardim Leonor, o Hospital Einstein sustenta uma demanda constante por consultórios, clínicas, laboratórios, alimentação e hospedagem para pacientes e acompanhantes. O MorumBIS acrescenta movimento em dias de evento, e o clube projeta até 12 shows no estádio em 2026 (BNews SP), o que beneficia bares, restaurantes e estacionamentos do entorno.","en":"In Jardim Leonor, Einstein Hospital sustains steady demand for medical offices, clinics, laboratories, food and lodging for patients and companions. MorumBIS adds activity on event days, and the club projects up to 12 concerts at the stadium in 2026 (BNews SP), which benefits nearby bars, restaurants and parking."}]},"artigo":{"titulo":{"pt":"Onde estão as oportunidades","en":"Where the opportunities are"},"paragrafos":[{"pt":"Nos 12 meses até agosto de 2026, a região registrou 279 vendas, cerca de 23 por mês, 21% a menos que no período anterior (ITBI, Prefeitura de São Paulo). Os preços seguiram em alta: o m² privativo estimado dos apartamentos chegou a R$ 10.044, alta de 8,4% em um ano (R$ 5.619 pela área do IPTU), e o apartamento típico foi vendido por R$ 850 mil, com cerca de 83 m² privativos. Menos negócios com preços maiores indicam compradores seletivos e espaço para quem anuncia imóveis bem conservados e com preço alinhado aos comparáveis.","en":"In the 12 months to August 2026, the area recorded 279 sales, about 23 per month, 21% fewer than in the previous period (ITBI records, São Paulo City Hall). Prices kept rising: the estimated private-area price for apartments reached R$ 10,044 per m², up 8.4% in a year (R$ 5,619 on the tax-record area basis), and the typical apartment sold for R$ 850,000, with about 83 m² of private area. Fewer deals at higher prices point to selective buyers and room for sellers who list well-kept properties priced in line with comparables."},{"pt":"Dentro da região, a Vila Progredior e o Caxingui ficaram em R$ 9.569/m² e o Jardim Leonor em R$ 12.004/m², alta de 45,7% que pode refletir a mudança no tipo de imóvel vendido (ITBI). Os grandes conjuntos, como o da Av. Prof. Francisco Morato, 2203, construído em 1975 e com 157 vendas desde 2024, oferecem muitas referências de preço. Prédios mais novos, como os da Rua Carlos Lima Morel, 180 (2022) e da Av. Padre Lebret, 725 e 801 (2012–13), marcam o topo da faixa, e a diferença entre esses dois grupos abre espaço para unidades reformadas em edifícios mais antigos.","en":"Within the area, Vila Progredior and Caxingui stood at R$ 9,569 per m² and Jardim Leonor at R$ 12,004 per m², a 45.7% rise that may reflect a change in the type of property sold (ITBI records). Large complexes, such as the one at Av. Prof. Francisco Morato 2203, built in 1975 and with 157 sales since 2024, offer many price references. Newer buildings, such as Rua Carlos Lima Morel 180 (2022) and Av. Padre Lebret 725 and 801 (2012–13), mark the top of the range, and the gap between these two groups creates room for renovated units in older buildings."},{"pt":"A infraestrutura em andamento sustenta a região no médio prazo: a extensão da Linha 4-Amarela até Taboão da Serra soma mais de R$ 4 bilhões em investimento (Diário do Transporte), o sistema de piscinões do Córrego Antonico prevê R$ 335 milhões contra alagamentos (Prefeitura de São Paulo) e a futura Linha 22-Marrom terá audiência pública no Butantã em dezembro (BNews SP). Para casas, o m² subiu 19,7% entre 2021–22 e 2025–26, enquanto o volume caiu 30% (ITBI), um quadro de oferta curta que favorece proprietários com documentação em ordem e compradores preparados para decidir com agilidade.","en":"Infrastructure under way supports the area over the medium term: the Line 4-Yellow extension to Taboão da Serra involves more than R$ 4 billion in investment (Diário do Transporte), the Antonico stream reservoir system plans R$ 335 million against flooding (São Paulo City Hall), and the future Line 22-Brown will hold a public hearing in Butantã in December (BNews SP). For houses, the price per m² rose 19.7% between 2021–22 and 2025–26 while volume fell 30% (ITBI records), a short-supply picture that favors owners with paperwork in order and buyers ready to decide quickly."}]},"noticias":{"titulo":{"pt":"Pesquisa e notícias","en":"Research and news"},"nota":{"pt":"Cada notícia foi conferida em duas fontes.","en":"Each news item was checked against two sources."},"itens":[{"data":"2026-10","t":{"pt":"MorumBIS recebe três shows do BTS com bloqueios no entorno do estádio","en":"MorumBIS hosts three BTS concerts with street closures around the stadium"},"d":{"pt":"O grupo se apresenta no estádio em 28, 30 e 31 de outubro, com abertura dos portões às 16h. Nos dias de show, a partir das 8h, a passagem pelos pontos de bloqueio fica restrita a moradores cadastrados previamente e a portadores de ingresso para a data.","en":"The group performs at the stadium on October 28, 30 and 31, with gates opening at 4 p.m. On show days, from 8 a.m., passage through the checkpoints is limited to pre-registered residents and ticket holders for that date."},"f":[["BNews SP","https://www.bnewssaopaulo.com.br/noticias/entretenimento/shows-do-bts-terao-bloqueios-no-entorno-do-morumbis-veja-novas-regras-de-acesso.html"],["Omelete","https://www.omelete.com.br/korea/bts-no-brasil-live-nation-policia-militar-esquema-de-seguranca-shows-em-sp"]]},{"data":"2026-10","t":{"pt":"Linha 22-Marrom terá audiência pública no Butantã em 1º de dezembro","en":"Line 22-Brown will hold a public hearing in Butantã on December 1"},"d":{"pt":"O projeto prevê cerca de 31 km e 19 estações entre Cotia e a estação Sumaré, passando pela Cidade Universitária e com integração à Linha 4-Amarela na estação Faria Lima. A convocação faz parte do licenciamento ambiental e ainda não define datas de obra ou de inauguração.","en":"The project calls for about 31 km and 19 stations between Cotia and Sumaré station, passing through the University City and connecting to Line 4-Yellow at Faria Lima station. The hearing is part of the environmental licensing process and does not yet set construction or opening dates."},"f":[["Diário do Transporte","https://diariodotransporte.com.br/2026/10/13/linha-22-marrom-tera-audiencias-em-dezembro-projeto-preve-19-estacoes-entre-cotia-e-sumare/"],["BNews SP","https://www.bnewssaopaulo.com.br/noticias/politica/governo-de-sp-marca-audiencias-publicas-para-debater-a-futura-linha-22-marrom-do-metro.html"]]},{"data":"2026-09","t":{"pt":"Obras da estação Chácara do Jockey mudam o trânsito na Francisco Morato por 5 anos","en":"Chácara do Jockey station works change traffic on Francisco Morato for five years"},"d":{"pt":"Desde 26 de setembro, trechos das ru
