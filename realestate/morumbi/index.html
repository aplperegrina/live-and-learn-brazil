/* Boletim de bairro: jornal de dados, ardósia azulada, goiaba e amarelo fechado; fontes e cartões do dashboard */
:root{
  --bg:#FBFCF8; --ink:#232B3A; --ink2:#3A4458; --muted:#56607A; --rule:#D5DAE3; --soft:#F6F9FF; --soft2:#E6EBF3;
  --blue:#34425E; --blue2:#4F6488; --blue3:#8E9DBB; --red:#E0604E; --red2:#F9DDD6;
  --yel:#C99A1F; --yeltx:#8C6A00; --champ:#DCC792; --slate:#3E495F; --onslate:#C3CAD6;
  --q1:#E2E7F0; --q2:#BAC4D7; --q3:#8796B3; --q4:#566A8E; --q5:#2E3B55; --q0:#EEF0F4; --h1:#F3E7D3; --h2:#E2C89C; --h3:#BF9454;
  --display:'Libertinus Sans', 'Segoe UI', Arial, sans-serif;
  --ui:'Open Sans', 'Segoe UI', Arial, sans-serif;
  --narrow:'PT Sans Narrow', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;font-weight:500;line-height:1.6;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue2)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.k{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.btn{font:700 15px/1 var(--ui);padding:14px 20px;border:0;background:var(--blue);color:#fff;cursor:pointer;min-height:46px;border-radius:0}
.btn.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.red{background:var(--red)}
.seg{display:inline-flex;border:2px solid var(--blue);flex-wrap:wrap}
.seg button{font:700 14px/1 var(--ui);padding:10px 14px;border:0;background:#fff;color:var(--blue);cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* barra superior */
.top{background:var(--slate);color:#fff;position:relative;overflow:hidden;border-bottom:2px solid var(--champ)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px;font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.1em}
.top::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:180px;background:var(--red);transform:skewX(-24deg)}
.top .wrap>*{position:relative;z-index:1}
.lang{display:inline-flex;border:1.5px solid var(--champ);background:rgba(255,255,255,.06)}
.lang button{background:transparent;color:#fff;border:0;font:700 15px/1 var(--narrow);padding:8px 14px;cursor:pointer;min-height:38px;letter-spacing:.12em}
.lang button[aria-pressed="true"]{background:var(--champ);color:var(--slate)}

/* cabeçalho */
.mast{border-bottom:3px solid var(--ink);padding-block:22px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:end}
.mast .bar{width:12px;align-self:stretch;background:var(--red)}
.mast .name{font-family:var(--display);font-weight:800;font-size:clamp(38px,6.4vw,74px);line-height:.95}
.mast .name span{color:var(--slate)}
.mast .meta{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--ink2);text-align:right;display:grid;gap:3px}
@media (max-width:640px){.mast{grid-template-columns:auto minmax(0,1fr)}.mast .meta{grid-column:1/-1;text-align:left}}

/* abertura + adivinhe */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:34px;padding-block:38px 42px;align-items:start;position:relative;background:var(--slate);box-shadow:0 0 0 100vmax var(--slate);clip-path:inset(0 -100vmax);color:#FAF9F4;border-top:2px solid var(--champ);border-image:linear-gradient(var(--champ) 0 0) 1 / 2px 0 0 0 / 0 100vmax}
.hero .small{color:var(--onslate)} .hero a{color:var(--champ)}
.hero h1{font-size:clamp(34px,4.8vw,56px);line-height:1.08;color:#FAF9F4}
.hero .lead{font-size:20px;color:var(--onslate);margin-top:14px;max-width:34em}
.guess{position:relative;background:var(--soft);color:var(--ink);padding:26px 24px 24px;border-top:6px solid var(--champ);display:grid;gap:14px}
.guess::before{content:"";position:absolute;right:0;top:-6px;width:34%;height:6px;background:var(--red)}
.guess h2{font-size:26px;line-height:1.15}
.guess .val{font-family:var(--display);font-weight:800;font-size:clamp(33px,4.2vw,49px);color:var(--blue);line-height:1}
.thermo{--tw:30px;--p:.3;position:relative;height:54px;margin:30px 0 0;padding-left:38px}
.thermo input[type=range]{position:absolute;left:34px;right:0;top:0;bottom:0;width:calc(100% - 34px);height:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:grab;touch-action:none}
.thermo input[type=range]:active{cursor:grabbing}
.thermo input[type=range]::-webkit-slider-runnable-track{height:54px;background:transparent}
.thermo input[type=range]::-moz-range-track{height:54px;background:transparent}

.cm-rows{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px 40px;border-top:1px solid var(--champ);padding-top:18px}
.cm-g h3{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.cm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;margin-bottom:9px;font-size:15px}
.cm-row span{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-row b{font-family:var(--display);font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums}
.cm-row i{grid-column:1/-1;display:block;height:8px;background:var(--soft2);border-radius:4px;overflow:hidden}
.cm-row i em{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cm-row.sm i em{background:var(--blue3)}

@media (max-width:900px){.compra{grid-template-columns:minmax(0,1fr);padding:24px 18px 20px}.compra-res{grid-template-columns:minmax(0,1fr)}.cm-plan svg{width:min(190px,60vw)}}
@media (prefers-reduced-motion: reduce){.cm-in.hint{animation:none}.cm-row i em{transition:none}}

/* animação de entrada */
.rise{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rise.on{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;transform:none;transition:none}.track .mk,.track .fill,.res .bar i{transition:none}}
.rcl{fill:none;stroke:var(--blue2);stroke-width:1.4;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.75}

/* ===== v2: capa de jornal, grupos, barra de seções e vitrine ===== */
:root{--gbar:52px}
html{scroll-padding-top:calc(var(--gbar) + 8px)}
::selection{background:var(--champ);color:var(--ink)}
.top::after{display:none}
/* capa */
.capa{padding-block:20px 0}
.capa-mast{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 24px;align-items:end;padding-bottom:14px}
.capa-ed{font-family:var(--narrow);font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--ink2);line-height:1.35}
.capa-ed.r{text-align:right}
.capa-tit{text-align:center}
.capa-tit .k{color:var(--ink2);font-size:14px;letter-spacing:.2em}
.capa-tit .name{font-family:var(--display);font-weight:800;font-size:clamp(48px,8.4vw,104px);line-height:.92;color:var(--ink);margin-top:6px}
.capa-rule{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);height:4px}
@media (max-width:700px){
  .capa-mast{grid-template-columns:minmax(0,1fr)}
  .capa-ed,.capa-ed.r{text-align:center;font-size:14px}
  .capa-ed:first-child{order:2}.capa-ed.r{order:3}
}
/* faixa dos quatro grupos */
.secoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--ink)}
.secoes a{display:grid;gap:3px;padding:12px 16px 13px;text-decoration:none;color:var(--ink);min-height:64px;align-content:center}
.secoes a + a{border-left:1px solid var(--rule)}
.secoes b{font-family:var(--narrow);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.secoes span{font-size:14.5px;color:var(--ink2);line-height:1.35}
.secoes a:hover b{color:var(--red)}
@media (max-width:760px){
  .secoes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .secoes a:nth-child(3){border-left:0}
  .secoes a:nth-child(n+3){border-top:1px solid var(--rule)}
  .secoes a{padding:11px 12px}
}
/* três colunas */
.capa-cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1fr);border-bottom:3px solid var(--ink);margin-bottom:6px}
.capa-cols > *{padding:22px 22px 24px;min-width:0}
.capa-cols > * + *{border-left:1px solid var(--rule)}
.capa-cols > :first-child{padding-left:0}.capa-cols > :last-child{padding-right:0}
.cc-rot{font-family:var(--narrow);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px;display:block}
.cc-main h2{font-size:clamp(28px,3.4vw,42px);line-height:1.08}
.cc-main h2 a,.cc-mid h3 a,.cc-vit h3 a{color:inherit;text-decoration:none}
.cc-main h2 a:hover,.cc-mid h3 a:hover,.cc-vit h3 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--champ)}
.cc-main p{color:var(--ink2);margin-top:10px;max-width:38em}
.cc-graf{margin-top:16px;max-width:520px}
.cc-graf svg{display:block;width:100%;height:auto;overflow:visible}
.cc-graf text{font-family:var(--narrow);font-size:13px;fill:var(--ink2)}
.cc-link{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;font-weight:700;color:var(--blue);text-decoration:none;border-bottom:2px solid var(--champ)}
.cc-link:hover{color:var(--red)}
.cc-mid{display:grid;align-content:start}
.cc-mid article{padding-block:2px 16px}
.cc-mid article + article{border-top:1px solid var(--rule);padding-top:14px}
.cc-mid h3{font-size:21px;line-height:1.2}
.cc-mid p{font-size:15px;color:var(--ink2);margin-top:5px}
.cc-vit figure{margin:0 0 12px;aspect-ratio:4/3;background:var(--soft2);overflow:hidden}
.cc-vit figure img{width:100%;height:100%;object-fit:cover;display:block}
.cc-vit h3{font-size:21px;line-height:1.2}
.cc-vit p{font-size:15px;color:var(--ink2);margin-top:5px}
@media (max-width:1000px){
  .capa-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cc-main{grid-column:1/-1;padding-right:0!important;border-bottom:1px solid var(--rule)}
  .cc-mid{border-left:0!important;padding-left:0!important}
}
@media (max-width:640px){
  .capa-cols{grid-template-columns:minmax(0,1fr)}
  .capa-cols > *{padding:18px 0!important;border-left:0!important}
  .cc-vit{order:2;border-bottom:1px solid var(--rule)}.cc-mid{order:3}
}
/* barra fixa dos grupos (aparece depois da capa) */
.gbar{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--ink);transform:translateY(-110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
.gbar.on{transform:none}
.gbar .wrap{display:flex;align-items:center;gap:4px;height:var(--gbar);overflow-x:auto;scrollbar-width:none}
.gbar .wrap::-webkit-scrollbar{display:none}
.gbar .nome{font-family:var(--display);font-weight:800;font-size:22px;margin-right:14px;white-space:nowrap;color:var(--ink);text-decoration:none}
.gbar a.g{font-family:var(--narrow);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-decoration:none;white-space:nowrap;padding:0 12px;min-height:44px;display:inline-flex;align-items:center;border-bottom:3px solid transparent}
.gbar a.g[aria-current="true"]{color:var(--blue);border-bottom-color:var(--red)}
@media (max-width:640px){.gbar .nome{display:none}.gbar a.g{padding:0 10px;font-size:14px}}
@media (prefers-reduced-motion: reduce){.gbar{transition:none}}
/* aberturas dos grupos */
.grupo{padding-block:10px 6px;margin-top:44px}
.grupo .wrap{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 28px;align-items:end;border-top:3px solid var(--ink);padding-top:16px}
.grupo h2{font-size:clamp(40px,6vw,72px);line-height:.95;color:var(--ink)}
.grupo p{color:var(--ink2);max-width:40em;padding-bottom:6px}
@media (max-width:760px){.grupo .wrap{grid-template-columns:minmax(0,1fr)}.grupo{padding-block:8px 0;margin-top:32px}}
#topo,#ritmo{margin-top:22px}
/* ritmo do mercado (taxas) */
.ritmo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));border-top:4px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.ritmo div{padding:16px 16px 16px 0;display:grid;gap:3px}
@media (min-width:700px){.ritmo div + div{padding-left:16px;border-left:1.5px solid var(--rule)}}
.ritmo b{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.2vw,38px);color:var(--blue);line-height:1.05}
.ritmo span{font-size:14.5px;color:var(--ink2);line-height:1.4}
.ritmo .up{color:var(--yeltx)}.ritmo .down{color:var(--blue)}
/* vitrine */
.vt-faixa + .vt-faixa{margin-top:38px}
.vt-faixa h3{font-family:var(--display);font-size:26px;line-height:1.15;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:16px}
.vt-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.vt-card{background:#fff;border-top:3px solid var(--champ);display:grid;grid-template-rows:auto 1fr;min-width:0;box-shadow:0 1px 2px rgba(35,43,58,.06),0 8px 22px -14px rgba(35,43,58,.22)}
.vt-card figure{margin:0;aspect-ratio:4/3;overflow:hidden;background:var(--soft2)}
.vt-card figure img{width:100%;height:100%;object-fit:cover;display:block}
.vt-body{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.vt-cod{font-family:var(--narrow);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vt-card h4{font-family:var(--display);font-size:22px;line-height:1.2;margin:0}
.vt-fatos{font-size:15px;color:var(--ink2);line-height:1.45}
.vt-preco{font-family:var(--display);font-weight:800;font-size:27px;color:var(--blue);line-height:1.1}
.vt-preco small{display:block;font-family:var(--ui);font-weight:500;font-size:13.5px;color:var(--muted);margin-top:3px}
.vt-car{font-size:14px;color:var(--ink2);line-height:1.45;border-top:1px solid var(--rule);padding-top:8px}
.vt-btn{justify-self:start;margin-top:4px;text-decoration:none;display:inline-flex;align-items:center}
.vt-vazio{color:var(--ink2);background:var(--soft);padding:18px 20px}
.vt-nota{margin-top:26px}
@media (max-width:860px){
  .vt-row{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:min(82%,330px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;margin-right:calc(-1 * max(18px, env(safe-area-inset-right, 0px)))}
  .vt-card{scroll-snap-align:start}
}

/* ===== v2: termômetro de vidro ===== */
.thermo.v2{--pl:58px;--pr:22px;height:112px;margin:22px 0 4px;padding:0;user-select:none}
.thermo.v2 .th-placa{position:absolute;left:30px;right:0;top:0;height:100%;background:linear-gradient(180deg,#fff,#FAFBFD);border:1px solid var(--champ);border-radius:6px;box-shadow:0 1px 2px rgba(35,43,58,.06)}
.thermo.v2 .th-grad{position:absolute;left:var(--pl);right:var(--pr);top:12px;height:38px}
.thermo.v2 .th-grad i{position:absolute;bottom:0;width:1px;height:6px;background:rgba(35,43,58,.45);transform:translateX(-.5px)}
.thermo.v2 .th-grad i.M{height:12px;width:1.5px;background:var(--ink)}
.thermo.v2 .th-grad b{position:absolute;bottom:15px;transform:translateX(-50%);font:700 13px/1 var(--narrow);color:var(--ink2);letter-spacing:.02em}
.thermo.v2 .th-un{position:absolute;right:8px;bottom:6px;font:700 11.5px/1 var(--narrow);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.thermo.v2 .th-vidro{position:absolute;left:30px;right:calc(var(--pr) - 12px);top:56px;height:28px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(226,231,240,.75) 55%,rgba(255,255,255,.95) 100%);box-shadow:inset 0 0 0 1.5px rgba(52,66,94,.5),inset 0 -4px 6px rgba(52,66,94,.10),0 1px 0 #fff}
.thermo.v2 .th-vidro::after{content:"";position:absolute;left:30px;right:14px;top:5px;height:3px;border-radius:2px;background:rgba(255,255,255,.95);box-shadow:0 0 2px rgba(255,255,255,.9)}
.thermo.v2 .th-cap{position:absolute;left:calc(var(--pl) - 30px);right:12px;top:10px;height:8px;border-radius:4px;background:rgba(52,66,94,.06);box-shadow:inset 0 1px 2px rgba(52,66,94,.18)}
.thermo.v2 .th-merc{position:absolute;left:-34px;top:0;bottom:0;width:calc(34px + var(--p) * (100% - 0px));border-radius:0 4px 4px 0;background:linear-gradient(180deg,#F39A88 0%,#E0604E 45%,#B4432F 100%)}
.thermo.v2 .th-merc::after{content:"";position:absolute;right:1px;top:1px;width:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.75)}
.thermo.v2 .th-bulbo{position:absolute;left:4px;top:45px;width:52px;height:52px;border-radius:50%;z-index:1;background:radial-gradient(circle at 34% 30%,#FFE3DC 0 6%,#F39A88 14%,#E0604E 48%,#A93B28 100%);box-shadow:inset 0 0 0 1.5px rgba(52,66,94,.5),inset -4px -6px 10px rgba(80,20,10,.25),0 6px 12px -6px rgba(169,59,40,.6)}
.thermo.v2 .th-bulbo::before{content:"";position:absolute;left:10px;top:8px;width:15px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-28deg)}
.thermo.v2 .th-ponta{position:absolute;top:89px;left:calc(var(--pl) + var(--p) * (100% - var(--pl) - var(--pr)));width:0;height:0;margin-left:-7px;border:7px solid transparent;border-bottom:9px solid var(--blue);border-top:0;pointer-events:none}
.thermo.v2 input[type=range]{position:absolute;left:var(--pl);right:var(--pr);top:40px;height:66px;width:auto;opacity:0;z-index:3;cursor:ew-resize;margin:0}
.thermo.v2 input[type=range]::-webkit-slider-runnable-track{height:66px}
.thermo.v2 input[type=range]::-moz-range-track{height:66px}
.thermo.v2 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:66px;margin-top:0;border:0;box-shadow:none}
.thermo.v2 input[type=range]::-moz-range-thumb{width:2px;height:66px;border:0;box-shadow:none}
.thermo.v2:focus-within .th-vidro{outline:3px solid var(--red);outline-offset:3px}
.thermo.v2 .realmk{top:2px;bottom:16px;width:2px;margin-left:-1px;left:calc(var(--pl) + var(--rp,0) * (100% - var(--pl) - var(--pr)));background:var(--blue);z-index:2}
.thermo.v2 .realmk span{bottom:auto;top:-24px;margin:0;background:var(--blue);color:#fff;box-shadow:none;padding:3px 8px;font:700 13px/1.1 var(--narrow);letter-spacing:.04em}
@media (prefers-reduced-motion: reduce){.thermo.v2 .realmk{transition:none}}
.guess .val{color:var(--red)}
.guess .val.vazio{letter-spacing:.02em}

.mapa-cta .tel{grid-row:1 / span 2;grid-column:2;font-family:var(--display);font-weight:800;color:var(--blue);font-size:24px;white-space:nowrap;text-decoration:none}
@media (max-width:640px){.mapa-cta{grid-template-columns:minmax(0,1fr)}.mapa-cta .tel{grid-row:auto;grid-column:auto;font-size:21px}}
/* no celular: busca, mapa (com a chamada) e, embaixo, o cartão da quadra */
@media (max-width:900px){.atlas{grid-template-columns:minmax(0,1fr);gap:14px}.panel{display:contents}.panel .finder{order:-2}.panel .msg{order:-1}.panel .pcard{order:1}.mapcol{display:contents}.mapa-cta{order:2}}
/* taxas do bairro: um painel, cada tópico em sanfona */
#painel .sec-h h2{font-size:clamp(22px,2.4vw,28px)}
.sanfonas{display:grid;gap:10px}
.sanfona{padding:0;gap:0;background:var(--papel)}
.sanfona > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:14px 18px;min-height:56px}
.sanfona > summary::-webkit-details-marker{display:none}
.sanfona > summary h3{font-size:20px}
.sanfona > summary::after,.hist > summary .sf-seta{content:"";width:12px;height:12px;border-right:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(45deg) translate(-3px,-3px);transition:transform .25s}
.sanfona[open] > summary::after,.hist[open] > summary .sf-seta{transform:rotate(225deg) translate(-3px,-3px)}
.sanfona > summary:hover h3,.hist > summary:hover h2{color:var(--redtx)}
.sanfona > summary:focus-visible,.hist > summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sf-corpo{padding:2px 18px 18px;display:grid;gap:8px;border-top:1px solid var(--rule)}
.sf-corpo > svg{max-width:860px}
.sf-corpo .two{margin-top:6px}
@media (prefers-reduced-motion: reduce){.sanfona > summary::after,.hist > summary .sf-seta{transition:none}}
/* dicas do bairro */
.forte .phrase{font-size:clamp(20px,2.2vw,27px);line-height:1.25}
.tips{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tip{background:var(--papel);padding:14px;gap:6px}
.tip .n{font-size:26px}
.tip h3{font-size:17.5px;line-height:1.2}
.tip p{font-size:14.5px;line-height:1.5}
@media (max-width:1000px){
  .tips{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:min(78%,280px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-right:calc(-1 * max(18px, env(safe-area-inset-right, 0px)))}
  .tip{scroll-snap-align:start}
}
.gcat:nth-child(even){background:var(--soft)}
/* um pouco de história, em sanfona com o relógio de bolso */
.hist{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
.hist > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:14px 4px}
.hist > summary::-webkit-details-marker{display:none}

.hist .relogio{display:block;filter:drop-shadow(0 2px 2px rgba(35,43,58,.18))}
.hist-corpo{padding:8px 0 22px}

<script id="C" type="application/json">{"prep":"no","edicao":{"pt":"Edição outubro–novembro de 2026","en":"October–November 2026 edition"},"dados_ate":{"pt":"Vendas registradas até agosto de 2026","en":"Sales recorded through August 2026"},"area_desc":{"pt":"Vila Progredior, Jardim Guedala, Cidade Jardim, Jardim Panorama, Real Parque, Caxingui e Jardim Previdência, entre a Raposo Tavares, a Av. Prof. Francisco Morato, a Av. Giovanni Gronchi, a Av. Morumbi e a Marginal Pinheiros.","en":"Vila Progredior, Jardim Guedala, Cidade Jardim, Jardim Panorama, Real Parque, Caxingui and Jardim Previdência, between Raposo Tavares, Francisco Morato, Giovanni Gronchi and Morumbi avenues and the Pinheiros riverside expressway."},"subareas":{"todos":{"pt":"Região toda","en":"Whole area"},"progredior":{"pt":"Vila Progredior e Guedala","en":"Vila Progredior & Guedala"},"caxingui":{"pt":"Caxingui e Jardim Previdência","en":"Caxingui & Jardim Previdência"},"cidadejardim":{"pt":"Cidade Jardim","en":"Cidade Jardim"},"panorama":{"pt":"Panorama e Real Parque","en":"Panorama & Real Parque"}},"forte":{"titulo":{"pt":"O forte do bairro","en":"The neighborhood's strength"},"frase":{"pt":"Bairros residenciais consolidados, ligados ao metrô e vizinhos de grandes polos como o Hospital Einstein, o MorumBIS e o Palácio dos Bandeirantes.","en":"Established residential neighborhoods with metro access, next to major hubs such as Einstein Hospital, the MorumBIS stadium and the Palácio dos Bandeirantes."},"itens":[{"pt":"Duas estações da Linha 4-Amarela atendem a região: Butantã e São Paulo-Morumbi, inaugurada em outubro de 2018.","en":"Two Line 4-Yellow stations serve the area: Butantã and São Paulo-Morumbi, opened in October 2018."},{"pt":"O Hospital Israelita Albert Einstein funciona no Jardim Leonor desde 1971 e concentra serviços de saúde e empregos no entorno.","en":"Albert Einstein Israelite Hospital has operated in Jardim Leonor since 1971 and anchors healthcare services and jobs nearby."},{"pt":"Entre 2021–22 e 2025–26, o m² dos apartamentos subiu 18,3% e o volume de vendas subiu 6,8% (ITBI).","en":"Between 2021–22 and 2025–26, the apartment price per m² rose 18.3% and sales volume rose 6.8% (ITBI)."},{"pt":"A oferta é variada: grandes condomínios dos anos 1970, prédios dos anos 2010 e 2020 e casas em ruas residenciais.","en":"The housing stock is varied: large 1970s complexes, buildings from the 2010s and 2020s, and houses on residential streets."}]},"dicas":{"titulo":{"pt":"Dicas para quem vai vender ou comprar","en":"Tips for sellers and buyers"},"itens":[{"t":{"pt":"Área do IPTU e área privativa","en":"Tax-record area and private area"},"d":{"pt":"A Prefeitura registra a área do IPTU, que inclui áreas comuns e vagas, e os anúncios usam a área privativa. Na hora de comparar preços, confira sempre qual das duas áreas está sendo usada. Neste boletim, os números principais estimam a área privativa e o valor pelo IPTU aparece ao lado.","en":"The City records the tax-record (IPTU) area, which includes common areas and parking, while listings use the private area. When comparing prices, always check which of the two areas is being used. Here, the headline figures estimate the private area and the IPTU-based value appears alongside."}},{"t":{"pt":"Compare dentro do mesmo condomínio","en":"Compare within the same complex"},"d":{"pt":"Grandes conjuntos, como o da Av. Prof. Francisco Morato, 2203 (1975), somam muitas vendas registradas e oferecem boas referências de preço. Compare unidades da mesma torre e metragem, e ajuste pelo estado de conservação, andar e valor do condomínio.","en":"Large complexes, such as the one at Av. Prof. Francisco Morato 2203 (1975), have many recorded sales and provide solid price references. Compare units in the same tower and size, then adjust for condition, floor and condominium fee."}},{"t":{"pt":"Calendário do MorumBIS","en":"MorumBIS event calendar"},"d":{"pt":"Em dias de jogos e shows, as vias do entorno do estádio têm bloqueios e o acesso pode ficar restrito a moradores cadastrados. Agende visitas fora dessas datas e informe o comprador sobre a rotina de eventos e o cadastro de moradores.","en":"On match and concert days, streets around the stadium are closed and access may be limited to registered residents. Schedule viewings outside those dates and tell buyers about the event routine and resident registration."}},{"t":{"pt":"Obras na Francisco Morato","en":"Works on Francisco Morato"},"d":{"pt":"A extensão da Linha 4-Amarela até Taboão da Serra traz canteiros e desvios na avenida, sobretudo no trecho da Vila Sônia, previstos para cerca de cinco anos. Verifique rotas de acesso ao imóvel e considere o benefício futuro das novas estações na avaliação.","en":"The Line 4-Yellow extension to Taboão da Serra brings work sites and detours on the avenue, especially in the Vila Sônia stretch, expected to last about five years. Check access routes to the property and weigh the future benefit of the new stations in the valuation."}},{"t":{"pt":"Drenagem e histórico da rua","en":"Drainage and street history"},"d":{"pt":"Partes da região, perto do Córrego Antonico, recebem um sistema de piscinões em obras. Pergunte ao condomínio e aos vizinhos sobre o histórico de alagamentos e acompanhe a entrega dos reservatórios.","en":"Parts of the area near the Antonico stream are receiving a reservoir system now under construction. Ask the building management and neighbors about past flooding and follow the delivery of the reservoirs."}}]},"relatorio":{"titulo":{"pt":"Relatório residencial e comercial","en":"Residential and commercial report"},"intro":{"pt":"Comparação entre 2021–2022 e 2025–2026, com as guias de ITBI pagas na Prefeitura. A variação de volume usa a média de vendas por mês.","en":"Comparison between 2021–2022 and 2025–2026, using the property-transfer tax (ITBI) records from the City. Volume change uses average sales per month."},"notas":{"apto":{"pt":"O m² subiu 18,3% e o volume de vendas subiu 6,8%.","en":"Price per m² rose 18.3% and sales volume rose 6.8%."},"casa":{"pt":"O m² subiu 29,9% e o volume de vendas caiu 22,9%.","en":"Price per m² rose 29.9% and sales volume fell 22.9%."},"escritorio":{"pt":"O m² subiu 43,4% e o volume de vendas subiu 10,5%; com poucas vendas, a variação deve ser lida com cautela.","en":"Price per m² rose 43.4% and sales volume rose 10.5%; with few sales, the change should be read with caution."},"loja":{"pt":"O m² caiu 16,0% e o volume de vendas subiu 18,2%; com poucas vendas, a variação deve ser lida com cautela.","en":"Price per m² fell 16.0% and sales volume rose 18.2%; with few sales, the change should be read with caution."}},"comercial_titulo":{"pt":"Comércio e serviços","en":"Retail and services"},"comercial":[{"pt":"A Av. Prof. Francisco Morato é o principal eixo comercial da região, com supermercados, shopping, concessionárias, farmácias e serviços de bairro ao longo de um corredor que liga o Butantã à Vila Sônia e a Taboão da Serra. A extensão da Linha 4-Amarela, que deve atender mais de 50 mil passageiros por dia entre Taboão da Serra e o centro (Diário do Transporte), tende a reforçar o fluxo de pessoas nesse eixo.","en":"Av. Prof. Francisco Morato is the area's main commercial axis, with supermarkets, a shopping mall, car dealerships, pharmacies and neighborhood services along a corridor that links Butantã to Vila Sônia and Taboão da Serra. The Line 4-Yellow extension, expected to serve more than 50,000 passengers a day between Taboão da Serra and downtown (Diário do Transporte), is likely to strengthen foot traffic along this axis."},{"pt":"No Jardim Leonor, o Hospital Einstein sustenta uma demanda constante por consultórios, clínicas, laboratórios, alimentação e hospedagem para pacientes e acompanhantes. O MorumBIS acrescenta movimento em dias de evento, e o clube projeta até 12 shows no estádio em 2026 (BNews SP), o que beneficia bares, restaurantes e estacionamentos do entorno.","en":"In Jardim Leonor, Einstein Hospital sustains steady demand for medical offices, clinics, laboratories, food and lodging for patients and companions. MorumBIS adds activity on event days, and the club projects up to 12 concerts at the stadium in 2026 (BNews SP), which benefits nearby bars, restaurants and parking."}]},"artigo":{"titulo":{"pt":"Onde estão as oportunidades","en":"Where the opportunities are"},"paragrafos":[{"pt":"Nos 12 meses até agosto de 2026, a região registrou 410 vendas de apartamentos, cerca de 34 por mês, 23,8% a menos que no período anterior (ITBI, Prefeitura de São Paulo). O m² privativo estimado chegou a R$ 10.349, alta de 6,8% em um ano (R$ 5.769 pela área do IPTU), e o apartamento típico foi vendido por R$ 1.157.000, com cerca de 111 m² privativos. Menos negócios com preços maiores indicam compradores seletivos e espaço para quem anuncia imóveis bem conservados e com preço alinhado aos comparáveis.","en":"In the 12 months to August 2026, the area recorded 410 apartment sales, about 34 a month, 23.8% fewer than in the previous period (ITBI, City of São Paulo). The estimated private-area price per m² reached R$ 10,349, up 6.8% in a year (R$ 5,769 by IPTU area), and the typical apartment sold for R$ 1,157,000, with about 111 m² of private area. Fewer deals at higher prices point to selective buyers and room for sellers who list well-kept homes priced in line with comparables."},{"pt":"Dentro da região, Vila Progredior e Guedala ficaram em R$ 10.635/m², Cidade Jardim em R$ 13.217/m² e Panorama e Real Parque em R$ 9.396/m² (ITBI). Os grandes conjuntos, como o da Av. Prof. Francisco Morato, 2203, construído em 1975 e com 163 vendas desde 2024, oferecem muitas referências de preço. Em Cidade Jardim, poucas vendas por ano e prédios muito diferentes entre si fazem o m² variar bastante, e o valor de cada unidade depende mais do prédio do que da média.","en":"Within the area, Vila Progredior and Guedala stood at R$ 10,635/m², Cidade Jardim at R$ 13,217/m² and Panorama and Real Parque at R$ 9,396/m² (ITBI). Large complexes such as Av. Prof. Francisco Morato, 2203, built in 1975 with 163 sales since 2024, offer many price references. In Cidade Jardim, few sales per year and very different buildings make the m² swing widely, and each unit's value depends more on the building than on the average."},{"pt":"A infraestrutura em andamento sustenta a região no médio prazo: a extensão da Linha 4-Amarela até Taboão da Serra soma mais de R$ 4 bilhões em investimento (Diário do Transporte), o sistema de piscinões do Córrego Antonico prevê R$ 335 milhões contra alagamentos (Prefeitura de São Paulo) e a futura Linha 22-Marrom terá audiência pública no Butantã em dezembro (BNews SP). Para casas, o m² subiu 29,9% entre 2021–22 e 2025–26, enquanto o volume caiu 22,9% (ITBI), um quadro de oferta curta que favorece proprietários com documentação em ordem e compradores preparados para decidir com agilidade.","en":"Infrastructure under way supports the area over the medium term: the Line 4-Yellow extension to Taboão da Serra involves more than R$ 4 billion in investment (Diário do Transporte), the Antonico stream reservoir system plans R$ 335 million against flooding (São Paulo City Hall), and the future Line 22-Brown will hold a public hearing in Butantã in December (BNews SP). For houses, the price per m² rose 19.7% between 2021–22 and 2025–26 while volume fell 30% (ITBI records), a short-supply picture that favors owners with paperwork in order and buyers ready to decide quickly."}]},"noticias":{"titulo":{"pt":"Pesquisa e notícias","en":"Research and news"},"nota":{"pt":"Cada notícia foi conferida em duas fontes.","en":"Each news item was checked against two sources."},"itens":[{"data":"2026-10","t":{"pt":"MorumBIS recebe três shows do BTS com bloqueios no entorno do estádio","en":"MorumBIS hosts three BTS concerts with street closures around the stadium"},"d":{"pt":"O grupo se apresenta no estádio em 28, 30 e 31 de outubro, com abertura dos portões às 16h. Nos dias de show, a partir das 8h, a passagem pelos pontos de bloqueio fica restrita a moradores cadastrados previamente e a portadores de ingresso para a data.","en":"The group performs at the stadium on October 28, 30 and 31, with gates opening at 4 p.m. On show days, from 8 a.m., passage through the checkpoints is limited to pre-registered residents and ticket holders for that date."},"f":[["BNews SP","https://www.bnewssaopaulo.com.br/noticias/entretenimento/shows-do-bts-terao-bloqueios-no-entorno-do-morumbis-veja-novas-regras-de-acesso.html"],["Omelete","https://www.omelete.com.br/korea/bts-no-brasil-live-nation-policia-militar-esquema-de-seguranca-shows-em-sp"]]},{"data":"2026-10","t":{"pt":"Linha 22-Marrom terá audiência pública no Butantã em 1º de dezembro","en":"Line 22-Brown will hold a public hearing in Butantã on December 1"},"d":{"pt":"O projeto prevê cerca de 31 km e 19 estações entre Cotia e a estação Sumaré, passando pela Cidade Universitária e com integração à Linha 4-Amarela na estação Faria Lima. A convocação faz parte do licenciamento ambiental e ainda não define datas de obra ou de inauguração.","en":"The project calls for about 31 km and 19 stations between Cotia and Sumaré station, passing through the University City and connecting to Line 4-Yellow at Faria Lima station. The hearing is part of the environmental licensing process and does not yet set construction or opening dates."},"f":[["Diário do Transporte","https://diariodotransporte.com.br/2026/10/13/linha-22-marrom-tera-audiencias-em-dezembro-projeto-preve-19-estacoes-entre-cotia-e-sumare/"],["BNews SP","https://www.bnewssaopaulo.com.br/noticias/politica/governo-de-sp-marca-audiencias-publicas-para-debater-a-futura-linha-22-marrom-do-metro.html"]]},{"data":"2026-09","t":{"pt":"Obras da estação Chácara do Jockey mudam o trânsito na Francisco Morato por 5 anos","en":"Chácara do Jockey station works change traffic on Francisco Morato for five years"},"d":{"pt":"Desde 26 de setembro, tr
