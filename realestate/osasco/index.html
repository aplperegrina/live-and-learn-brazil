/* Boletim de bairro: jornal de dados, ardósia azulada, goiaba e amarelo fechado; fontes e cartões do dashboard */
:root{
  --bg:#FBFCF8; --ink:#232B3A; --ink2:#3A4458; --muted:#56607A; --rule:#D5DAE3; --soft:#F6F9FF; --soft2:#E6EBF3;
  --blue:#34425E; --blue2:#4F6488; --blue3:#8E9DBB; --red:#E0604E; --red2:#F9DDD6;
  --yel:#C99A1F; --yeltx:#8C6A00; --champ:#DCC792; --slate:#3E495F; --onslate:#C3CAD6;
  --q1:#E2E7F0; --q2:#BAC4D7; --q3:#8796B3; --q4:#566A8E; --q5:#2E3B55; --q0:#EEF0F4; --h1:#F3E7D3; --h2:#E2C89C; --h3:#BF9454;
  --display:'Libertinus Sans', 'Segoe UI', Arial, sans-serif;
  --ui:'Open Sans', 'Segoe UI', Arial, sans-serif;
  --narrow:'PT Sans Narrow', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;font-weight:500;line-height:1.6;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue2)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.k{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.btn{font:700 15px/1 var(--ui);padding:14px 20px;border:0;background:var(--blue);color:#fff;cursor:pointer;min-height:46px;border-radius:0}
.btn.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.red{background:var(--red)}
.seg{display:inline-flex;border:2px solid var(--blue);flex-wrap:wrap}
.seg button{font:700 14px/1 var(--ui);padding:10px 14px;border:0;background:#fff;color:var(--blue);cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* barra superior */
.top{background:var(--slate);color:#fff;position:relative;overflow:hidden;border-bottom:2px solid var(--champ)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px;font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.1em}
.top::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:180px;background:var(--red);transform:skewX(-24deg)}
.top .wrap>*{position:relative;z-index:1}
.lang{display:inline-flex;border:1.5px solid var(--champ);background:rgba(255,255,255,.06)}
.lang button{background:transparent;color:#fff;border:0;font:700 15px/1 var(--narrow);padding:8px 14px;cursor:pointer;min-height:38px;letter-spacing:.12em}
.lang button[aria-pressed="true"]{background:var(--champ);color:var(--slate)}

/* cabeçalho */
.mast{border-bottom:3px solid var(--ink);padding-block:22px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:end}
.mast .bar{width:12px;align-self:stretch;background:var(--red)}
.mast .name{font-family:var(--display);font-weight:800;font-size:clamp(38px,6.4vw,74px);line-height:.95}
.mast .name span{color:var(--slate)}
.mast .meta{font-family:var(--narrow);font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--ink2);text-align:right;display:grid;gap:3px}
@media (max-width:640px){.mast{grid-template-columns:auto minmax(0,1fr)}.mast .meta{grid-column:1/-1;text-align:left}}

/* abertura + adivinhe */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:34px;padding-block:38px 42px;align-items:start;position:relative;background:var(--slate);box-shadow:0 0 0 100vmax var(--slate);clip-path:inset(0 -100vmax);color:#FAF9F4;border-top:2px solid var(--champ);border-image:linear-gradient(var(--champ) 0 0) 1 / 2px 0 0 0 / 0 100vmax}
.hero .small{color:var(--onslate)} .hero a{color:var(--champ)}
.hero h1{font-size:clamp(34px,4.8vw,56px);line-height:1.08;color:#FAF9F4}
.hero .lead{font-size:20px;color:var(--onslate);margin-top:14px;max-width:34em}
.guess{position:relative;background:var(--soft);color:var(--ink);padding:26px 24px 24px;border-top:6px solid var(--champ);display:grid;gap:14px}
.guess::before{content:"";position:absolute;right:0;top:-6px;width:34%;height:6px;background:var(--red)}
.guess h2{font-size:26px;line-height:1.15}
.guess .val{font-family:var(--display);font-weight:800;font-size:clamp(33px,4.2vw,49px);color:var(--blue);line-height:1}
.thermo{--tw:30px;--p:.3;position:relative;height:54px;margin:30px 0 0;padding-left:38px}
.thermo .bulb{position:absolute;left:0;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F59A88,var(--red) 60%,#B4432F);box-shadow:0 0 0 5px #fff,0 0 0 7px var(--ink)}
.thermo .tube{position:absolute;left:34px;right:0;top:50%;height:22px;margin-top:-11px;background:#fff;border-radius:0 11px 11px 0;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden}

<script id="C" type="application/json">{"prep":"em","edicao":{"pt":"Edição outubro–novembro de 2026","en":"October–November 2026 edition"},"dados_ate":{"pt":"Vendas registradas até agosto de 2026","en":"Sales recorded through August 2026"},"area_desc":{"pt":"Zona sul de Osasco: 20 bairros entre a Av. dos Autonomistas, a Raposo Tavares e o Rodoanel, com predomínio de casas em lote próprio.","en":"Osasco's south zone: 20 neighborhoods between Av. dos Autonomistas, the Raposo Tavares highway and the Rodoanel, where houses on their own lots predominate."},"subareas":{"todos":{"pt":"Zona Sul","en":"Zona Sul"}},"forte":{"titulo":{"pt":"O forte da região","en":"The area's strength"},"frase":{"pt":"Uma região de casas e bairros consolidados, com apartamentos anunciados abaixo da mediana da cidade e acesso a trem, rodovias e, no futuro, metrô.","en":"An area of houses and established neighborhoods, with apartments listed below the city median and access to commuter rail, highways and, in the future, the metro."},"itens":[{"pt":"Oferta majoritária de casas: 1.546 dos 2.724 anúncios levantados (57%), opção rara para quem busca terreno próprio perto da capital.","en":"Most of the supply is houses: 1,546 of the 2,724 listings collected (57%), an uncommon option for buyers who want their own lot close to São Paulo."},{"pt":"Apartamentos com mediana anunciada de R$ 6.531/m², cerca de 13% abaixo da mediana de Osasco (R$ 7.500/m²) no mesmo levantamento.","en":"Apartments with a median asking price of R$ 6,531/m², about 13% below the Osasco median (R$ 7,500/m²) in the same survey."},{"pt":"Mobilidade: estações Quitaúna e Comandante Sampaio (Km 18) da Linha 8-Diamante da CPTM, acesso ao Rodoanel e à Raposo Tavares e a Linha 22-Marrom do Metrô em licenciamento ambiental.","en":"Mobility: Quitaúna and Comandante Sampaio (Km 18) stations on CPTM Line 8-Diamond, access to the Rodoanel and Raposo Tavares, and Metro Line 22-Brown in environmental licensing."},{"pt":"Áreas verdes e bairros planejados, como a City Bussocaba, onde fica o Parque Municipal Chico Mendes, o maior parque da cidade.","en":"Green areas and planned neighborhoods such as City Bussocaba, home to Parque Municipal Chico Mendes, the city's largest park."}]},"dicas":{"titulo":{"pt":"Dicas para quem vai vender ou comprar","en":"Tips for sellers and buyers"},"itens":[{"t":{"pt":"Preço pedido e preço fechado","en":"Asking price and closing price"},"d":{"pt":"Este boletim usa preços de anúncio, pois Osasco não divulga os dados de transações do ITBI. O valor fechado costuma ficar abaixo do pedido: na pesquisa do CRECISP de junho de 2026 para Osasco e região, 43,6% das vendas tiveram desconto, em parte deles entre 6% e 20%. Uma avaliação séria exige comparáveis do mesmo bairro e padrão e a leitura da matrícula do imóvel.","en":"This bulletin uses listing prices, since Osasco does not publish ITBI transaction data. Closing prices tend to be lower: in CRECISP's June 2026 survey for Osasco and region, 43.6% of sales closed with a discount, some of them between 6% and 20%. A sound valuation needs comparables of the same neighborhood and standard and a reading of the property's matrícula (title record)."}},{"t":{"pt":"Casa em lote próprio ou apartamento em condomínio","en":"House on its own lot or condo apartment"},"d":{"pt":"Na zona sul, o m² anunciado das casas (R$ 3.597, sobre a área construída e incluindo o terreno) é bem menor que o dos apartamentos (R$ 6.531). A comparação só faz sentido dentro de cada tipo: casa se avalia por terreno, área construída e estado de conservação; apartamento, por condomínio, andar, vagas e idade do prédio.","en":"In the south zone, the asking price per m² of houses (R$ 3,597, on built area and including the land) is well below that of apartments (R$ 6,531). Comparisons only make sense within each type: a house is valued by its lot, built area and condition; an apartment by its building, floor, parking and age."}},{"t":{"pt":"Habite-se e averbação da construção","en":"Occupancy permit and recorded construction"},"d":{"pt":"Muitas casas da região foram ampliadas ao longo dos anos. Antes de anunciar, confira se a área construída consta na matrícula (averbação) e se há habite-se; diferenças entre o que existe e o que está registrado podem travar o financiamento e reduzir o valor.","en":"Many houses in the area were enlarged over the years. Before listing, check that the built area appears on the matrícula (averbação) and that there is an habite-se (occupancy permit); gaps between what exists and what is registered can block financing and lower the price."}},{"t":{"pt":"Financiamento define o ritmo","en":"Financing sets the pace"},"d":{"pt":"Na pesquisa do CRECISP de janeiro de 2026 para Osasco e região, 76,5% das vendas foram financiadas por bancos (55,9% pela Caixa e 20,6% por outros bancos). Imóvel com documentação em ordem e preço compatível com a avaliação do banco tende a fechar mais rápido.","en":"In CRECISP's January 2026 survey for Osasco and region, 76.5% of sales were bank-financed (55.9% by Caixa and 20.6% by other banks). A property with clean paperwork and a price in line with the bank's appraisal tends to close faster."}},{"t":{"pt":"Distância até a estação","en":"Distance to the station"},"d":{"pt":"Proximidade a pé das estações Quitaúna e Comandante Sampaio, da Linha 8-Diamante, é um atributo concreto a destacar no anúncio e a pesar na compra. A futura Linha 22-Marrom ainda está em licenciamento; trate-a como horizonte de longo prazo, sem data de obra definida.","en":"Walking distance to Quitaúna and Comandante Sampaio stations on Line 8-Diamond is a concrete attribute to highlight in a listing and to weigh when buying. The future Line 22-Brown is still in licensing; treat it as a long-term prospect with no construction date set."}}]},"relatorio":{"titulo":{"pt":"Relatório por bairro","en":"Neighborhood report"},"intro":{"pt":"Comparação entre 2021–2022 e 2025–2026, com as guias de ITBI pagas na Prefeitura. A variação de volume usa a média de vendas por mês.","en":"Comparison between 2021–2022 and 2025–2026, using the property-transfer tax (ITBI) records from the City. Volume change uses average sales per month."},"notas":{"apto":{"pt":"Apartamentos: mediana de R$ 6.531/m² na zona sul, contra R$ 7.500/m² em Osasco (preço pedido).","en":"Apartments: median R$ 6,531/m² in the south zone, versus R$ 7,500/m² across Osasco (asking price)."},"casa":{"pt":"Casas: R$ 3.597/m² de área construída, terreno incluído; são 1.546 dos 2.724 anúncios da região.","en":"Houses: R$ 3,597/m² of built area, land included; they make up 1,546 of the area's 2,724 listings."}},"comercial_titulo":{"pt":"Comércio, serviços e eixos de circulação","en":"Retail, services and corridors"},"comercial":[{"pt":"A Avenida dos Autonomistas, principal eixo de Osasco, atravessa o Km 18 e Quitaúna e concentra comércio de rua, serviços e bares ao longo do trajeto; no Km 18, as avenidas Hildebrando de Lima e Comandante Sampaio completam a malha comercial do bairro (Wikipédia, verbete Km 18). Mais ao sul, a Avenida João de Andrade, no Jardim Santo Antônio, abriga equipamentos como o CEU José Saramago, escolhido para a audiência pública da Linha 22-Marrom (Diário do Transporte, 13/10/2026).","en":"Avenida dos Autonomistas, Osasco's main corridor, runs through Km 18 and Quitaúna, with street retail, services and bars along its length; in Km 18, Avenida Hildebrando de Lima and Avenida Comandante Sampaio complete the neighborhood's commercial grid (Wikipedia, Km 18 entry). Further south, Avenida João de Andrade in Jardim Santo Antônio hosts facilities such as CEU José Saramago, chosen for the Line 22-Brown public hearing (Diário do Transporte, 13/10/2026)."},{"pt":"No extremo sul, o Rodoanel Mário Covas cruza Osasco e se conecta à Raposo Tavares na altura do km 24, ligação que favorece atividades de distribuição e serviços voltados a quem circula pela região oeste (Concessionária RodoAnel Oeste, 13/04/2026). Para o imóvel comercial, a leitura prática é a mesma do residencial: endereços em avenidas de fluxo e próximos às estações tendem a ter mais procura, e a regularidade da construção pesa tanto quanto a localização.","en":"At the southern edge, the Rodoanel Mário Covas crosses Osasco and connects to the Raposo Tavares highway around km 24, a link that supports distribution and service businesses serving the western region (RodoAnel Oeste concession, 13/04/2026). For commercial property the practical reading matches the residential one: addresses on busy avenues and near stations tend to draw more demand, and a fully regularized building matters as much as location."}]},"artigo":{"titulo":{"pt":"Onde estão as oportunidades","en":"Where the opportunities are"},"paragrafos":[{"pt":"Em 19/10/2026 levantamos 2.724 anúncios ativos na zona sul de Osasco (QuintoAndar): 1.178 apartamentos e 1.546 casas. A mediana pedida dos apartamentos ficou em R$ 6.531/m² de área privativa, cerca de 13% abaixo da mediana de Osasco no mesmo levantamento (R$ 7.500/m²). Na cidade como um todo, o índice FipeZap marcou R$ 8.732/m² em setembro de 2026, com alta de 0,74% no mês (FipeZap, set/2026). Todos esses números são preços pedidos em anúncios; o valor de fechamento costuma ser menor.","en":"On 19/10/2026 we collected 2,724 active listings in Osasco's south zone (QuintoAndar): 1,178 apartments and 1,546 houses. The median asking price for apartments was R$ 6,531/m² of private area, about 13% below the Osasco median in the same survey (R$ 7,500/m²). For the city as a whole, the FipeZap index stood at R$ 8,732/m² in September 2026, up 0.74% in the month (FipeZap, Sep/2026). All these figures are listing prices; closing values are usually lower."},{"pt":"A diferença entre bairros é grande. Bela Vista (R$ 10.438/m²), Km 18 (R$ 10.000/m²) e City Bussocaba (R$ 8.729/m²) lideram entre os apartamentos, enquanto Veloso (R$ 4.776/m²), Conceição (R$ 5.545/m²), Cidade das Flores (R$ 5.623/m²), São Pedro (R$ 5.769/m²) e Novo Osasco (R$ 5.833/m²) ficam na faixa inferior; o m² pedido em Veloso é menos da metade do de Bela Vista. Novo Osasco (235 anúncios) e São Pedro (191) combinam preço mais baixo e oferta ampla, o que dá ao comprador margem de escolha e de negociação; Jaguaribe (201) e Padroeira (186) ficam perto da mediana da região.","en":"The gap between neighborhoods is wide. Bela Vista (R$ 10,438/m²), Km 18 (R$ 10,000/m²) and City Bussocaba (R$ 8,729/m²) lead for apartments, while Veloso (R$ 4,776/m²), Conceição (R$ 5,545/m²), Cidade das Flores (R$ 5,623/m²), São Pedro (R$ 5,769/m²) and Novo Osasco (R$ 5,833/m²) sit at the lower end; the asking price per m² in Veloso is less than half that of Bela Vista. Novo Osasco (235 listings) and São Pedro (191) combine lower prices with ample supply, giving buyers room to choose and negotiate; Jaguaribe (201) and Padroeira (186) sit close to the area median."},{"pt":"No horizonte, a Linha 22-Marrom do Metrô, entre Cotia e Sumaré, prevê uma estação Santa Maria em Osasco e terá audiência pública na cidade em 02/12/2026 (Diário do Transporte, 13/10/2026; BNews São Paulo, 10/10/2026); a audiência integra o licenciamento ambiental e não autoriza obras. Para quem vende, a pesquisa do CRECISP de junho de 2026 para Osasco e região mostra que 43,6% das vendas tiveram desconto sobre o pedido (CRECISP, jun/2026): anunciar perto do valor que comparáveis e avaliação bancária sustentam tende a encurtar o prazo de venda.","en":"Looking ahead, Metro Line 22-Brown, between Cotia and Sumaré, includes a Santa Maria station in Osasco and will hold a public hearing in the city on 02/12/2026 (Diário do Transporte, 13/10/2026; BNews São Paulo, 10/10/2026); the hearing is part of environmental licensing and does not authorize construction. For sellers, CRECISP's June 2026 survey for Osasco and region shows that 43.6% of sales closed below the asking price (CRECISP, Jun/2026): listing close to what comparables and the bank appraisal support tends to shorten the time on market."}]},"noticias":{"titulo":{"pt":"Pesquisa e notícias","en":"Research and news"},"nota":{"pt":"Cada notícia foi conferida em duas fontes.","en":"Each news item was checked against two sources."},"itens":[{"data":"2026-10","t":{"pt":"Linha 22-Marrom do Metrô terá audiência pública em Osasco em 2 de dezembro","en":"Metro Line 22-Brown to hold a public hearing in Osasco on December 2"},"d":{"pt":"A audiência sobre o estudo de impacto ambiental da linha Cotia–Sumaré será às 17h no Teatro do CEU José Saramago, Av. João de Andrade, 1.355, Jardim Santo Antônio. O projeto prevê 19 estações e a audiência faz parte do licenciamento, sem autorizar o início das obras.","en":"The hearing on the environmental impact study for the Cotia–Sumaré line will be at 5 p.m. at the CEU José Saramago theater, Av. João de Andrade 1,355, Jardim Santo Antônio. The project includes 19 stations, and the hearing is part of licensing and does not authorize construction to start."},"f":[["Diário do Transporte","https://diariodotransporte.com.br/2026/10/13/linha-22-marrom-tera-audiencias-em-dezembro-projeto-preve-19-estacoes-entre-cotia-e-sumare/"],["BNews São Paulo","https://www.bnewssaopaulo.com.br/noticias/politica/governo-de-sp-marca-audiencias-publicas-para-debater-a-futura-linha-22-marrom-do-metro.html"]]},{"data":"2026-10","t":{"pt":"FipeZap: m² anunciado em Osasco chega a R$ 8.732 em setembro","en":"FipeZap: Osasco asking price reaches R$ 8,732/m² in September"},"d":{"pt":"O índice FipeZap registrou preço médio de anúncio de R$ 8.732/m² para imóveis residenciais em Osasco em setembro de 2026, alta de 0,74% no mês. O indicador acompanha anúncios de venda em 56 cidades brasileiras.","en":"The FipeZap index recorded an average residential asking price of R$ 8,732/m² in Osasco in September 2026, up 0.74% in the month. The indicator tracks sale listings in 56 Brazilian cities."},"f":[["FipeZap (Fipe), set/2026","https://downloads.fipe.org.br/indices/fipezap/fipezap-202609-residencial-venda.pdf"],["MySide","https://myside.com.br/guia-imoveis/valor-metro-quadrado-osasco-sp"]]},{"data":"2026-07","t":{"pt":"Rodoanel inicia nova etapa de obras no viaduto do km 24, em Osasco","en":"Rodoanel starts new phase of works on the km 24 viaduct in Osasco"},"d":{"pt":"Em 17/07/2026 começou a segunda etapa da recuperação do pavimento, da laje e da pré-laje no km 24+400 da pista externa, com bloqueio das faixas 3 e 4 e da alça de acesso da Raposo Tavares ao Rodoanel externo. As obras, iniciadas em 15/04/2026, funcionam 24 horas por dia e têm desvio sinalizado pela Marginal Padroeira.","en":"On 17/07/2026 the second phase of repairs to the pavement, slab and pre-slab at km 24+400 of the outer carriageway began, closing lanes 3 and 4 and the ramp from Raposo Tavares onto the outer Rodoanel. The works, started on 15/04/2026, run 24 hours a day with a signposted detour via Marginal Padroeira."},"f":[["Concessionária RodoAnel Oeste","https://rodovias.motiva.com.br/rodoanel/noticias/2026/julho/rodoanel-oeste-avanca-para-nova-etapa-das-obras-de-recuperacao-d/"],["Visão Oeste","https://visaooeste.com.br/nova-etapa-de-obras-no-rodoanel-em-osasco-inicia-nesta-sexta-feira-17-com-bloqueio-de-faixas/"]]},{"data":"2026-06","t":{"pt":"Osasco tem 521 moradias aprovadas no Minha Casa, Minha Vida Entidades","en":"Osasco gets 521 homes approved under Minha Casa, Minha Vida Entidades"},"d":{"pt":"Três dos seis projetos apresentados por entidades habitacionais foram selecionados pelo programa federal, somando 521 unidades, e a prefeitura cedeu áreas públicas para viabilizá-los. Com o resultado, Osasco ficou entre os 11 municípios do país com mais unidades selecionadas nesta etapa.","en":"Three of the six projects submitted by housing associations were selected by the federal program, totaling 521 units, with the city providing public land to make them viable. With this result, Osasco ranked among the 11 Brazilian municipalities with the most units selected in this round."},
